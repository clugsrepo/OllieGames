<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ollie's Playground</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #1a1040;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: rgba(26, 16, 64, 0.92);
    border-bottom: 2px solid rgba(255, 255, 255, 0.15);
    z-index: 10;
    align-items: center;
  }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: bold;
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 9px 14px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }
  button:hover  { background: rgba(255, 255, 255, 0.22); }
  button:active { transform: scale(0.94); }

  button.on {
    background: #ffd93d;
    color: #1a1040;
    border-color: #ffd93d;
  }

  .home {
    margin-left: auto;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: bold;
    color: #ffd93d;
    padding: 9px 14px;
  }

  /* squeeze the buttons up on small phone screens */
  @media (max-width: 560px) {
    #toolbar { gap: 5px; padding: 7px; }
    button   { font-size: 0.82rem; padding: 7px 9px; border-radius: 10px; }
    .home    { font-size: 0.82rem; padding: 7px 9px; }
  }

  canvas { display: block; }

  #hint {
    position: fixed;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.8s;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button data-spawn="ragdoll">🙂 Person</button>
  <button data-spawn="croc">🐊 Croc</button>
  <button data-spawn="crawler">🕷️ Crawler</button>
  <button data-spawn="ball">⚪ Ball</button>
  <button data-spawn="box">📦 Box</button>
  <button data-spawn="plank">➖ Plank</button>
  <button id="btn-gravity">🌍 Gravity</button>
  <button id="btn-slowmo">🐌 Slow-mo</button>
  <button id="btn-zoom">🔍 Normal</button>
  <button id="btn-full">⛶ Fullscreen</button>
  <button id="btn-heal">❤️ Heal all</button>
  <button id="btn-clear">🧹 Clear</button>
  <a class="home" href="../../index.html">← Home</a>
</div>

<canvas id="c"></canvas>
<p id="hint">Drag things around and fling them!</p>

<script>
/* =====================================================================
   OLLIE'S PLAYGROUND
   A ragdoll physics sandbox.

   The physics is called "Verlet integration". It sounds fancy but the
   idea is simple:

     - Everything is made of DOTS and STICKS.
     - A dot remembers where it was LAST frame. The difference between
       where it is now and where it was is its speed. Neat trick - we
       never have to store speed separately!
     - A stick joins two dots and keeps them the right distance apart.

   Join enough dots with enough sticks and you get a wobbly person.
   ===================================================================== */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// ---- Settings you can play with! ----
let GRAVITY  = 0.55;   // how hard things fall
let BOUNCE   = 0.45;   // how bouncy the floor is
let FRICTION = 0.995;  // 1 = slippery forever, lower = more drag
const ITERATIONS = 8;  // higher = stiffer, less stretchy

let gravityOn = true;
let slowMo    = false;

// ---- The world ----
let dots      = [];   // every dot in the world
let sticks    = [];   // every stick joining two dots
let creatures = [];   // things that are ALIVE and move by themselves
let people    = [];   // everyone, and how healthy they are

/* The screen and the WORLD are two different sizes!

   W and H are how many pixels the screen has.
   WW and WH are how big the world is INSIDE the game.

   If we zoom out to 0.5, everything is drawn half as big, so the world
   becomes twice as wide and twice as tall - loads more room to play in.
   All the physics uses the world sizes; only the drawing uses the zoom. */

let W = 0, H = 0, TOP = 0;          // the real screen, in pixels
let WW = 0, WH = 0, WTOP = 0;       // the world, in game units

const ZOOMS = [1, 0.62, 0.4];       // normal, big, huge
let zoomStep = 0;
let zoom = ZOOMS[0];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  TOP = document.getElementById("toolbar").offsetHeight;

  zoom = ZOOMS[zoomStep];
  WW   = W / zoom;
  WH   = H / zoom;
  WTOP = TOP / zoom;
}
window.addEventListener("resize", resize);
resize();


/* ---------------------------------------------------------------
   MAKING DOTS AND STICKS
   --------------------------------------------------------------- */

function makeDot(x, y, radius, colour) {
  const dot = {
    x: x, y: y,
    oldx: x, oldy: y,   // where it was last frame
    r: radius || 8,
    colour: colour || "#ffd93d"
  };
  dots.push(dot);
  return dot;
}

function makeStick(a, b, visible, thickness) {
  // The stick's length is however far apart the dots start out.
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  const stick = {
    a: a,
    b: b,
    length: len,
    restLength: len,        // the length it always wants to go back to
    visible: visible !== false,
    thickness: thickness || 10
  };
  sticks.push(stick);
  return stick;
}


/* ---------------------------------------------------------------
   THINGS WE CAN SPAWN
   --------------------------------------------------------------- */

const SKIN_COLOURS = ["#ffb37a", "#f5d0a9", "#c98a5b", "#8d5524", "#ffd1a3"];
// no green shirts - people would blend into the crocodiles!
const SHIRT_COLOURS = ["#ff6b6b", "#6bcbff", "#a06bff", "#ffd93d", "#ff8fd9", "#ff9f43"];

// Make everything bigger or smaller by changing this one number!
const SIZE = 1.6;

function spawnRagdoll(x, y) {
  const skin  = SKIN_COLOURS[Math.floor(Math.random() * SKIN_COLOURS.length)];
  const shirt = SHIRT_COLOURS[Math.floor(Math.random() * SHIRT_COLOURS.length)];

  // Every person keeps track of how they're feeling.
  const person = { health: 100, ouch: 0, ko: false, dizzy: 0, safe: 10 };
  people.push(person);

  const S = SIZE;
  // little helper so we don't have to write "* S" a hundred times
  const dot = (dx, dy, r, c) => {
    const d = makeDot(x + dx * S, y + dy * S, r * S, c);
    d.person = true;      // so crocodiles know who to chase!
    d.body = person;      // which person this bit belongs to
    return d;
  };

  // same idea for sticks - "bone" just makes a stick and remembers
  // which person it belongs to
  const bone = (a, b, visible, thickness) => {
    const s = makeStick(a, b, visible, thickness);
    s.body = person;
    return s;
  };

  // Build the body out of dots
  const head  = dot(  0, -42, 15, skin);
  head.face = true;   // only heads get eyes and a smile
  const neck  = dot(  0, -22,  6, shirt);
  const chest = dot(  0,  -6,  9, shirt);
  const hip   = dot(  0,  18,  9, shirt);

  const elbowL = dot(-20,  -2, 6, shirt);
  const handL  = dot(-32,  16, 7, skin);
  const elbowR = dot( 20,  -2, 6, shirt);
  const handR  = dot( 32,  16, 7, skin);

  const kneeL  = dot(-11, 46, 7, "#3b5bdb");
  const footL  = dot(-13, 72, 8, "#2b2b45");
  const kneeR  = dot( 11, 46, 7, "#3b5bdb");
  const footR  = dot( 13, 72, 8, "#2b2b45");

  // Join them with sticks (the bones!)
  bone(head, neck,   true,  9 * S);
  bone(neck, chest,  true, 18 * S);
  bone(chest, hip,   true, 20 * S);

  bone(chest, elbowL, true, 9 * S);
  bone(elbowL, handL, true, 8 * S);
  bone(chest, elbowR, true, 9 * S);
  bone(elbowR, handR, true, 8 * S);

  bone(hip, kneeL,  true, 11 * S);
  bone(kneeL, footL, true, 10 * S);
  bone(hip, kneeR,  true, 11 * S);
  bone(kneeR, footR, true, 10 * S);

  // Invisible braces so the body doesn't fold up like a deckchair.
  // These are also the "muscles" - when someone is knocked out we switch
  // them off, and they go completely floppy.
  bone(head, chest, false);
  bone(neck, hip,   false);
  bone(chest, kneeL, false);
  bone(chest, kneeR, false);
  bone(elbowL, elbowR, false);   // keeps the shoulders apart
  bone(hip, handL, false);       // stops arms folding right through
  bone(hip, handR, false);

  person.head = head;
  return person;
}

function spawnBall(x, y) {
  const colour = SHIRT_COLOURS[Math.floor(Math.random() * SHIRT_COLOURS.length)];
  makeDot(x, y, 26 * SIZE, colour);
}

function spawnBox(x, y) {
  const s = 30 * SIZE;
  const c = "#c98a5b";
  const tl = makeDot(x - s, y - s, 8 * SIZE, c);
  const tr = makeDot(x + s, y - s, 8 * SIZE, c);
  const br = makeDot(x + s, y + s, 8 * SIZE, c);
  const bl = makeDot(x - s, y + s, 8 * SIZE, c);

  makeStick(tl, tr, true, 14 * SIZE);
  makeStick(tr, br, true, 14 * SIZE);
  makeStick(br, bl, true, 14 * SIZE);
  makeStick(bl, tl, true, 14 * SIZE);
  makeStick(tl, br, false);   // diagonals stop it squashing flat
  makeStick(tr, bl, false);
}

function spawnPlank(x, y) {
  const w = 70 * SIZE, h = 8 * SIZE;
  const c = "#a06bff";
  const tl = makeDot(x - w, y - h, 6 * SIZE, c);
  const tr = makeDot(x + w, y - h, 6 * SIZE, c);
  const br = makeDot(x + w, y + h, 6 * SIZE, c);
  const bl = makeDot(x - w, y + h, 6 * SIZE, c);

  makeStick(tl, tr, true, 12 * SIZE);
  makeStick(tr, br, true, 12 * SIZE);
  makeStick(br, bl, true, 12 * SIZE);
  makeStick(bl, tl, true, 12 * SIZE);
  makeStick(tl, br, false);
  makeStick(tr, bl, false);
}


/* ---------------------------------------------------------------
   THE CROCODILE 🐊

   The croc is built out of dots and sticks just like everything else,
   but it's ALIVE: every frame it looks around for the nearest person,
   waddles towards them, and snaps its jaws shut.

   The clever bit is the jaw. There's an invisible stick between the top
   and bottom of the mouth called the "muscle". We just change how LONG
   that stick wants to be - long for open, short for shut - and the
   physics does the rest. That's how you make anything bend or grab.
   --------------------------------------------------------------- */

const CROC_GREEN = "#3fa34d";
const CROC_DARK  = "#2d7a38";

function spawnCroc(x, y) {
  const croc = { body: [], t: Math.random() * 10, facing: 1, turn: 0,
                 prey: null, holdTimer: 0, cooldown: 0, stuck: 0, lastX: x, hopCool: 0, rest: 0, progressTick: 0, lastCx: x };

  const S = SIZE;
  const dir = Math.random() < 0.5 ? 1 : -1;   // facing left or right
  croc.facing = dir;

  // helper: place a dot using croc-shaped coordinates
  const dot = (dx, dy, r, c) => {
    const d = makeDot(x + dx * S * dir, y + dy * S, r * S, c);
    d.owner = croc;          // so the croc never bites itself
    croc.body.push(d);
    return d;
  };

  // spine, from tail to nose
  const tail = dot(-92,  0,  5, CROC_DARK);
  const b3   = dot(-62,  0,  9, CROC_GREEN);
  const b2   = dot(-32,  0, 11, CROC_GREEN);
  const b1   = dot(  0,  0, 11, CROC_GREEN);
  const neck = dot( 26,  0, 10, CROC_GREEN);
  const hinge= dot( 46,  2,  9, CROC_GREEN);

  // the two jaw tips
  const upperTip = dot(102, -5, 5, CROC_GREEN);
  const lowerTip = dot(102, 11, 5, CROC_DARK);

  // stubby little legs
  const frontFoot = dot(  6, 24, 6, CROC_DARK);
  const backFoot  = dot(-56, 24, 6, CROC_DARK);

  // ---- the body ----
  makeStick(tail, b3,  true, 11 * S);
  makeStick(b3, b2,    true, 19 * S);
  makeStick(b2, b1,    true, 22 * S);
  makeStick(b1, neck,  true, 20 * S);
  makeStick(neck, hinge, true, 17 * S);

  // ---- the jaws ----
  makeStick(hinge, upperTip, true, 11 * S);   // top of the mouth
  makeStick(hinge, lowerTip, true,  9 * S);   // bottom of the mouth

  // The TOP jaw is bolted to his body so his snout stays pointing
  // forwards instead of drooping into the floor. Only the BOTTOM jaw
  // swings - which is how a real croc does it anyway.
  makeStick(neck, upperTip, false);
  makeStick(b1,   upperTip, false);

  // THE MUSCLE - we change this length to open and close the mouth
  croc.muscle = makeStick(upperTip, lowerTip, false);
  croc.openLen   = 46 * S;
  croc.closedLen = 13 * S;

  // ---- legs ----
  makeStick(b1, frontFoot, true, 9 * S);
  makeStick(b3, backFoot,  true, 9 * S);
  makeStick(neck, frontFoot, false);   // stops the legs splaying about
  makeStick(b2, backFoot,  false);

  // ---- invisible braces to keep him croc-shaped ----
  makeStick(tail, b2,  false);
  makeStick(b3, b1,    false);
  makeStick(b2, neck,  false);
  makeStick(b1, hinge, false);

  // settings the shared creature brain reads
  croc.kind      = "croc";
  croc.speed     = CROC_SPEED;
  croc.turnGap   = 40 * S;
  croc.hopLift   = 4.5 * S;
  croc.biteRange = 46 * S;
  croc.grabRange = 40 * S;
  croc.gapeRange = 150 * S;
  croc.holdFor   = 75;

  croc.hinge = hinge;
  croc.neck  = neck;
  croc.upperTip = upperTip;
  croc.lowerTip = lowerTip;

  creatures.push(croc);
  return croc;
}


/* ---------------------------------------------------------------
   THE CRAWLER 🕷️

   A little grey blocky beast with four long spindly legs and a
   hunched back. Its knees stick up ABOVE its body, which is what
   makes it look so creepy.

   It uses exactly the same brain as the crocodile - walk towards a
   person, snap, carry, throw - just with different numbers. That's why
   we moved all the croc's settings onto the creature itself. The brain
   doesn't care what shape you are.
   --------------------------------------------------------------- */

const CRAWL_DARK  = "#4c525c";
const CRAWL_MID   = "#666d7a";
const CRAWL_LIGHT = "#7d8593";

function spawnCrawler(x, y) {
  const crawler = { body: [], legs: [], t: Math.random() * 10, facing: 1, turn: 0,
                    prey: null, holdTimer: 0, cooldown: 0, stuck: 0, lastX: x,
                    hopCool: 0, rest: 0, progressTick: 0, lastCx: x };

  // SMALL! About knee-high next to a person.
  const S = SIZE * 0.5;
  const dir = Math.random() < 0.5 ? 1 : -1;
  crawler.facing = dir;

  const dot = (dx, dy, r, c) => {
    const d = makeDot(x + dx * S * dir, y + dy * S, r * S, c);
    d.owner = crawler;
    crawler.body.push(d);
    return d;
  };

  // ---- the hunched spine, from tail to snout ----
  const tail     = dot(-86,  10, 7, CRAWL_DARK);
  const hip      = dot(-58,  -6, 13, CRAWL_MID);
  const backMid  = dot(-26, -18, 15, CRAWL_MID);   // the top of the hunch
  const shoulder = dot(  4, -12, 14, CRAWL_MID);
  const neck     = dot( 28,   4, 10, CRAWL_MID);
  const hinge    = dot( 50,  16,  9, CRAWL_MID);

  // ---- long toothy snout ----
  const upperTip = dot(94,  10, 5, CRAWL_MID);
  const lowerTip = dot(94,  26, 5, CRAWL_DARK);

  // ---- spine sticks ----
  makeStick(tail, hip,        true, 12 * S);
  makeStick(hip, backMid,     true, 26 * S);
  makeStick(backMid, shoulder,true, 27 * S);
  makeStick(shoulder, neck,   true, 20 * S);
  makeStick(neck, hinge,      true, 16 * S);

  // ---- jaws ----
  makeStick(hinge, upperTip, true, 10 * S);
  makeStick(hinge, lowerTip, true,  8 * S);
  makeStick(neck, upperTip, false);       // snout stays pointing forwards
  makeStick(shoulder, upperTip, false);

  crawler.muscle    = makeStick(upperTip, lowerTip, false);
  crawler.openLen   = 40 * S;
  crawler.closedLen = 11 * S;

  /* ---- the legs ----
     Each leg is hip -> KNEE -> foot, and the knee sits high above the
     back. We build four of them, two on each side, and give each one a
     different "phase" so they don't all move together - that's what
     makes it scuttle instead of hop. */
  const makeLeg = (attach, brace, kneeX, kneeY, footX, footY, phase, colour) => {
    const knee = dot(kneeX, kneeY, 6, colour);
    const foot = dot(footX, footY, 7, CRAWL_DARK);

    // The knee is bolted to TWO points on the body. Two sticks to two
    // different places is what makes it rigid - one stick alone would
    // just let the knee swing, and the leg would fold flat.
    const thigh = makeStick(attach, knee, true, 7 * S);
    makeStick(brace,  knee, false);

    const shin = makeStick(knee, foot, true, 6 * S);

    // ...and the foot needs bracing too. Hanging off the knee alone, the
    // foot was an upside-down pendulum - it just slid out sideways and
    // the whole beast sat down on the floor.
    makeStick(attach, foot, false);

    crawler.legs.push({ knee, foot, thigh, shin, phase,
                        thighRest: thigh.length });
  };

  /* back pair - the tall inverted-V ones from Ollie's picture.
     The knee goes WAY up above the back and the foot WAY down below,
     which is what gives it those long spidery legs. */
  makeLeg(hip, backMid, -68, -80, -94, 82, 0.0,           CRAWL_DARK);
  makeLeg(hip, tail,    -46, -72, -62, 82, Math.PI,       CRAWL_MID);
  // front pair
  makeLeg(shoulder, backMid, 16, -78, 46, 82, Math.PI * 0.5, CRAWL_DARK);
  makeLeg(shoulder, neck,    -2, -70,  2, 82, Math.PI * 1.5, CRAWL_MID);

  // ---- braces to hold the hunch together ----
  makeStick(tail, backMid,     false);
  makeStick(hip, shoulder,     false);
  makeStick(backMid, neck,     false);
  makeStick(shoulder, hinge,   false);

  // ---- settings for the shared creature brain ----
  crawler.kind      = "crawler";
  crawler.speed     = 1.9;          // faster and twitchier than a croc
  crawler.turnGap   = 34 * S;
  crawler.hopLift   = 5 * S;
  crawler.biteRange = 44 * S;
  crawler.grabRange = 36 * S;
  crawler.gapeRange = 150 * S;
  crawler.holdFor   = 55;           // lets go sooner than a croc

  crawler.hinge = hinge;
  crawler.neck  = neck;
  crawler.upperTip = upperTip;
  crawler.lowerTip = lowerTip;
  crawler.scale = S;

  creatures.push(crawler);
  return crawler;
}

// make the legs scuttle by stretching and squashing them in turn
function animateLegs(c) {
  c.t += 0.13;
  for (const leg of c.legs) {
    // Each leg is at a different point in the cycle (its "phase"), so
    // they take it in turns instead of all twitching together. It's only
    // a small stretch - the legs have to stay stiff enough to stand on!
    const step = Math.sin(c.t + leg.phase);
    leg.thigh.length = leg.thighRest * (1 + step * 0.09);
  }
}


function drawCrawler(c) {
  const H = c.hinge, N = c.neck, U = c.upperTip, L = c.lowerTip;
  const S = c.scale;

  let hx = H.x - N.x, hy = H.y - N.y;
  const hlen = Math.hypot(hx, hy) || 1;
  hx /= hlen; hy /= hlen;

  // perpendicular pointing at its BACK (away from the lower jaw)
  let px = -hy, py = hx;
  if ((L.x - U.x) * px + (L.y - U.y) * py > 0) { px = -px; py = -py; }

  // ---- teeth ----
  ctx.fillStyle = "#e8e8e8";
  const jaw = (from, to, towardX, towardY) => {
    let jx = to.x - from.x, jy = to.y - from.y;
    const jlen = Math.hypot(jx, jy) || 1;
    jx /= jlen; jy /= jlen;
    let qx = -jy, qy = jx;
    if (qx * towardX + qy * towardY < 0) { qx = -qx; qy = -qy; }
    for (let t = 0.25; t < 0.95; t += 0.14) {
      const bx = from.x + jx * jlen * t;
      const by = from.y + jy * jlen * t;
      const w = 2.4 * S, h = 6 * S;
      ctx.beginPath();
      ctx.moveTo(bx - jx * w, by - jy * w);
      ctx.lineTo(bx + jx * w, by + jy * w);
      ctx.lineTo(bx + qx * h, by + qy * h);
      ctx.closePath();
      ctx.fill();
    }
  };
  jaw(H, U, -px, -py);
  jaw(H, L,  px,  py);

  // ---- blocky plates along its back, like the picture ----
  ctx.fillStyle = CRAWL_LIGHT;
  ctx.strokeStyle = "#343841";
  ctx.lineWidth = 1.5 * S;
  const spine = c.body.slice(0, 6);
  for (let i = 1; i < spine.length - 1; i++) {
    const d = spine[i];
    const a = spine[i - 1], b2 = spine[i + 1];
    let sx = b2.x - a.x, sy = b2.y - a.y;
    const sl = Math.hypot(sx, sy) || 1;
    sx /= sl; sy /= sl;
    const qx = -sy, qy = sx;
    const w = d.r * 1.15, t = d.r * 0.85;

    ctx.beginPath();
    ctx.moveTo(d.x - sx * w - qx * t, d.y - sy * w - qy * t);
    ctx.lineTo(d.x + sx * w - qx * t, d.y + sy * w - qy * t);
    ctx.lineTo(d.x + sx * w + qx * t, d.y + sy * w + qy * t);
    ctx.lineTo(d.x - sx * w + qx * t, d.y - sy * w + qy * t);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // ---- two little glowing eyes ----
  const ex = H.x + px * 7 * S - hx * 2 * S;
  const ey = H.y + py * 7 * S - hy * 2 * S;
  ctx.fillStyle = "#ffd93d";
  for (const off of [-2.5, 2.5]) {
    ctx.beginPath();
    ctx.arc(ex + px * off * S, ey + py * off * S, 2.6 * S, 0, Math.PI * 2);
    ctx.fill();
  }
}


const CROC_SPEED = 1.1;   // how fast the croc waddles (bigger = zoomier croc!)

function updateCreatures() {
  for (const c of creatures) {
    if (c.legs) animateLegs(c);   // crawlers scuttle
    const U = c.upperTip, L = c.lowerTip;

    // the middle of his mouth - this is where he grabs things
    const mouthX = (U.x + L.x) / 2;
    const mouthY = (U.y + L.y) / 2;

    if (c.cooldown > 0) c.cooldown--;

    // ---- is he already carrying someone? ----
    if (c.prey) {
      c.muscle.length = c.closedLen;      // keep the mouth shut!
      c.prey.x = mouthX;
      c.prey.y = mouthY;

      c.holdTimer--;
      if (c.holdTimer <= 0) {
        // THROW! (in Verlet, moving oldx/oldy is how you set speed)
        c.prey.oldx = c.prey.x + c.facing * 3;
        c.prey.oldy = c.prey.y + 10;
        c.prey.heldBy = null;
        c.prey = null;
        c.cooldown = 100;                 // have a little rest first
      }
      continue;
    }

    // ---- look for the nearest bit of a person to chase ----
    // (any bit will do - a hand or a foot is just as good as a head!)
    let target = null, bestDist = Infinity;
    for (const d of dots) {
      if (!d.person) continue;
      const dx = d.x - mouthX, dy = d.y - mouthY;
      const dist = dx * dx + dy * dy;
      if (dist < bestDist) { bestDist = dist; target = d; }
    }

    if (!target) {
      // nobody about - just laze around opening and closing his mouth
      c.t += 0.015;
      const yawn = 0.5 + 0.5 * Math.sin(c.t);
      c.muscle.length = c.closedLen + (c.openLen - c.closedLen) * yawn * 0.45;
      continue;
    }

    bestDist = Math.sqrt(bestDist);

    // where's the middle of the croc?
    let cx = 0;
    for (const d of c.body) cx += d.x;
    cx /= c.body.length;

    const bodyDir = c.hinge.x >= cx ? 1 : -1;   // way he's pointing
    const wantDir = target.x >= cx ? 1 : -1;    // way dinner is
    if (c.turn > 0) c.turn--;

    // A croc can't walk backwards! If his dinner is behind him he has to
    // spin right round. We flip every dot to the other side of his middle.
    if (bodyDir !== wantDir && c.turn <= 0 && Math.abs(target.x - cx) > c.turnGap) {
      for (const d of c.body) {
        d.x    = 2 * cx - d.x;
        d.oldx = 2 * cx - d.oldx;   // mirror his speed too, or he'd jolt
      }
      c.turn = 45;
    }

    c.facing = c.hinge.x >= cx ? 1 : -1;

    /* ---- is he actually getting anywhere? ----

       If a croc shoves someone up against a wall, he can't go forward,
       but he keeps pushing anyway. All that squashing has to go
       somewhere, and the only way left is UP - so he'd get squirted
       into the sky like a wet bar of soap. (He really did. He ended up
       500 pixels in the air.)

       So every so often we check whether he's actually moved. If he
       hasn't, he gives up and has a rest instead of pushing harder. */
    c.progressTick++;
    if (c.progressTick >= 40) {
      if (Math.abs(cx - c.lastCx) < 6) c.rest = 160;
      c.lastCx = cx;
      c.progressTick = 0;
    }
    if (c.rest > 0) c.rest--;

    // ---- waddle forwards ----
    // We give him a nudge each step, but stop nudging once he's at top
    // speed - otherwise he'd get faster and faster forever!
    if (c.facing === wantDir && c.rest <= 0) {
      for (const d of c.body) {
        const vx = d.x - d.oldx;
        if (c.facing > 0 ? vx < c.speed : vx > -c.speed) {
          d.x += c.facing * 0.05;
        }
      }
    }

    // If he's wedged against something, he lifts his HEAD to climb over it.
    // (We only lift the front of him - lifting all of him made him rear up
    // like a horse, which was funny but not very crocodile.)
    //
    // He's only allowed to do this if he's actually STANDING on something.
    // Without that check he'd hop while in mid-air, and since his x stops
    // changing up there he'd count as stuck and hop again... and again...
    // and fly off into space. Which he did!
    if (c.hopCool > 0) c.hopCool--;
    const crocVY = Math.abs(c.hinge.y - c.hinge.oldy);
    const onGround = crocVY < 1.2;

    if (Math.abs(c.hinge.x - c.lastX) < 0.4 && onGround) c.stuck++; else c.stuck = 0;
    c.lastX = c.hinge.x;

    if (c.stuck > 40 && c.hopCool <= 0) {
      for (const d of [c.neck, c.hinge, c.upperTip, c.lowerTip]) d.y -= c.hopLift;
      c.stuck = 0;
      c.hopCool = 110;   // no chaining hops together
    }

    // ---- CHOMP ----
    if (bestDist < c.biteRange && c.cooldown <= 0) {
      c.muscle.length = c.closedLen;

      // did anything end up inside his mouth?
      const grabR = c.grabRange;
      for (const d of dots) {
        // never grab another croc - two crocs tugging the same dot
        // would fight each other forever
        if (d.owner || d === held || d.controlled) continue;
        const gx = d.x - mouthX, gy = d.y - mouthY;
        if (gx * gx + gy * gy < grabR * grabR) {
          c.prey = d;
          c.prey.heldBy = c;   // see the note in solveCollisions!
          c.holdTimer = c.holdFor;
          if (d.body) hurt(d.body, 14);   // those teeth smart a bit!
          break;
        }
      }
    } else if (bestDist < c.gapeRange) {
      c.muscle.length = c.openLen;        // getting close - open wide!
    } else {
      c.muscle.length = c.closedLen * 1.6; // still far off - mouth mostly shut
    }
  }
}


function drawCroc(c) {
  const H = c.hinge, N = c.neck, U = c.upperTip, L = c.lowerTip;

  // which way is the head pointing?
  let hx = H.x - N.x, hy = H.y - N.y;
  const hlen = Math.hypot(hx, hy) || 1;
  hx /= hlen; hy /= hlen;

  // A line at right angles to his head. There are two ways it could
  // point, so we pick the one pointing away from his bottom jaw - that
  // way it always finds his BACK, even if he's upside down.
  let px = -hy, py = hx;
  if ((L.x - U.x) * px + (L.y - U.y) * py > 0) { px = -px; py = -py; }

  // ---- teeth ----
  ctx.fillStyle = "#fff";
  const jaw = (from, to, towardX, towardY) => {
    let jx = to.x - from.x, jy = to.y - from.y;
    const jlen = Math.hypot(jx, jy) || 1;
    jx /= jlen; jy /= jlen;

    // teeth stick out sideways from the jaw, pointing into the mouth
    let qx = -jy, qy = jx;
    if (qx * towardX + qy * towardY < 0) { qx = -qx; qy = -qy; }

    for (let t = 0.32; t < 0.95; t += 0.17) {
      const bx = from.x + jx * jlen * t;
      const by = from.y + jy * jlen * t;
      const w = 3.2 * SIZE, h = 7 * SIZE;
      ctx.beginPath();
      ctx.moveTo(bx - jx * w, by - jy * w);
      ctx.lineTo(bx + jx * w, by + jy * w);
      ctx.lineTo(bx + qx * h, by + qy * h);
      ctx.closePath();
      ctx.fill();
    }
  };
  jaw(H, U, -px, -py);   // top teeth point down into the mouth
  jaw(H, L,  px,  py);   // bottom teeth point up into the mouth

  // ---- bumpy scales along his back ----
  ctx.fillStyle = CROC_DARK;
  const spine = c.body.slice(0, 5);
  for (const d of spine) {
    ctx.beginPath();
    ctx.arc(d.x + px * d.r * 0.7, d.y + py * d.r * 0.7, d.r * 0.42, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- eye, sitting on top of his head ----
  const ex = H.x + px * 9 * SIZE - hx * 3 * SIZE;
  const ey = H.y + py * 9 * SIZE - hy * 3 * SIZE;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(ex, ey, 6.5 * SIZE, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a1a2e";
  ctx.beginPath();
  ctx.arc(ex + hx * 1.5 * SIZE, ey + hy * 1.5 * SIZE, 4.2 * SIZE, 0, Math.PI * 2);
  ctx.fill();

  // ---- nostril on the end of his snout ----
  ctx.fillStyle = CROC_DARK;
  ctx.beginPath();
  ctx.arc(U.x - hx * 5 * SIZE + px * 3 * SIZE, U.y - hy * 5 * SIZE + py * 3 * SIZE,
          2.4 * SIZE, 0, Math.PI * 2);
  ctx.fill();
}


/* ---------------------------------------------------------------
   OUCH! - getting hurt

   How do we know someone got hurt? We watch their SPEED.

   If a dot is zooming along at speed 20 and then suddenly it's only
   doing speed 2, it must have smacked into something hard. The bigger
   that sudden drop, the bigger the bump. A gentle landing barely
   changes their speed, so it doesn't hurt at all.
   --------------------------------------------------------------- */

const HURT_AT   = 7;     // bumps smaller than this don't hurt at all
const HURT_MULT = 1.6;   // how much damage a big bump does

// remember how fast everyone was going BEFORE we sort the collisions out
function rememberSpeeds() {
  for (const d of dots) {
    if (!d.body) continue;
    d.speedBefore = Math.hypot(d.x - d.oldx, d.y - d.oldy);
  }
}

// ...then see who got stopped suddenly.
//
// Careful! A person is made of 12 dots, and in a big crash ALL of them
// stop at once. If we hurt them once per dot they'd take 12 times too
// much damage. So we find each person's WORST bump and only count that.
function checkForBumps() {
  for (const person of people) person.worstBump = 0;

  for (const d of dots) {
    const person = d.body;
    if (!person || person.ko) continue;

    const speedAfter = Math.hypot(d.x - d.oldx, d.y - d.oldy);
    const bump = d.speedBefore - speedAfter;

    if (bump > person.worstBump) person.worstBump = bump;
  }

  for (const person of people) {
    if (person.safe > 0) { person.safe--; continue; }   // just been healed
    if (person.gettingUp) continue;                     // still unfolding
    if (person.worstBump > HURT_AT) {
      hurt(person, (person.worstBump - HURT_AT) * HURT_MULT);
    }
  }
}

function hurt(person, amount) {
  if (person.ko) return;

  person.health -= amount;
  person.ouch = 12;               // flash red for a moment

  if (person.health <= 0) {
    person.health = 0;
    person.ko = true;
    person.dizzy = 0;

    // Knocked out! Switch off all their invisible braces so they go
    // completely floppy, like a proper rag doll.
    for (const s of sticks) {
      if (s.body === person && !s.visible) s.disabled = true;
    }
  }
}

function healEveryone() {
  for (const person of people) {
    person.health = 100;
    person.ko = false;
    person.ouch = 0;
    person.safe = 30;
  }

  /* Getting up gently.

     If we just switched the braces back on, a folded-up body would whip
     straight in a fraction of a second - hard enough that our bump
     detector thought it was a car crash and hurt them all over again.
     Healing someone injured them!

     So instead each brace starts at whatever length it is RIGHT NOW,
     and creeps back to its proper length over the next second. The
     person unfolds smoothly and stands up, instead of snapping. */
  for (const s of sticks) {
    if (!s.disabled) continue;
    s.disabled = false;
    s.length = Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y);
    s.easing = true;
  }
}

// creep every easing stick back towards its proper length
function easeSticks() {
  for (const person of people) person.gettingUp = false;

  for (const s of sticks) {
    if (!s.easing) continue;
    s.length += (s.restLength - s.length) * 0.06;

    if (Math.abs(s.restLength - s.length) < 0.5) {
      s.length = s.restLength;
      s.easing = false;
    } else if (s.body) {
      // this person is still unfolding - don't let the unfolding hurt them
      s.body.gettingUp = true;
    }
  }
}


/* ---------------------------------------------------------------
   THE PHYSICS
   --------------------------------------------------------------- */

// A dot is "controlled" when something is holding it in place - either
// your finger, or a crocodile's mouth. Controlled dots ignore gravity and
// can't be shoved around by sticks or bumps.
function markControlled() {
  for (const d of dots) d.controlled = false;
  if (held) held.controlled = true;
  for (const c of creatures) if (c.prey) c.prey.controlled = true;
}

// STEP 1: move every dot
function moveDots() {
  const g = gravityOn ? GRAVITY : 0;

  for (const d of dots) {
    if (d.controlled) continue;   // being held - we'll place it ourselves

    // speed = how far it moved last frame
    let vx = (d.x - d.oldx) * FRICTION;
    let vy = (d.y - d.oldy) * FRICTION;

    d.oldx = d.x;
    d.oldy = d.y;

    d.x += vx;
    d.y += vy + g;
  }
}

// STEP 2: make sure sticks stay the right length
function solveSticks() {
  for (const s of sticks) {
    if (s.disabled) continue;   // switched off - this person is floppy!
    const dx = s.b.x - s.a.x;
    const dy = s.b.y - s.a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;

    // How far off are we? Share the fix between both dots.
    const diff = (s.length - dist) / dist * 0.5;
    const offx = dx * diff;
    const offy = dy * diff;

    if (!s.a.controlled) { s.a.x -= offx; s.a.y -= offy; }
    if (!s.b.controlled) { s.b.x += offx; s.b.y += offy; }
  }
}

// STEP 3: stop dots overlapping each other (so stuff piles up)
function solveCollisions() {
  for (let i = 0; i < dots.length; i++) {
    const a = dots[i];
    for (let j = i + 1; j < dots.length; j++) {
      const b = dots[j];

      /* A croc holds its dinner right inside its own mouth. The dinner
         can't be pushed (we're holding it there on purpose), so the
         collision below shoved the CROC away instead - 16 times every
         frame. That launched him into orbit. So: a croc and the thing
         it's biting simply don't bump into each other. */
      if (a.heldBy === b.owner || b.heldBy === a.owner) continue;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const minDist = a.r + b.r;

      // quick reject before doing the expensive square root
      if (Math.abs(dx) > minDist || Math.abs(dy) > minDist) continue;

      const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      if (dist >= minDist) continue;

      const push = (minDist - dist) / dist * 0.5;
      const offx = dx * push;
      const offy = dy * push;

      if (!a.controlled) { a.x -= offx; a.y -= offy; }
      if (!b.controlled) { b.x += offx; b.y += offy; }
    }
  }
}

// STEP 4: keep everything inside the walls
function solveWalls() {
  for (const d of dots) {
    // floor
    if (d.y + d.r > WH) {
      const vy = d.y - d.oldy;
      d.y = WH - d.r;
      d.oldy = d.y + vy * BOUNCE;
    }
    // ceiling (just under the toolbar)
    if (d.y - d.r < WTOP) {
      const vy = d.y - d.oldy;
      d.y = WTOP + d.r;
      d.oldy = d.y + vy * BOUNCE;
    }
    // left wall
    if (d.x - d.r < 0) {
      const vx = d.x - d.oldx;
      d.x = d.r;
      d.oldx = d.x + vx * BOUNCE;
    }
    // right wall
    if (d.x + d.r > WW) {
      const vx = d.x - d.oldx;
      d.x = WW - d.r;
      d.oldx = d.x + vx * BOUNCE;
    }
  }
}


/* ---------------------------------------------------------------
   DRAGGING WITH MOUSE OR FINGER
   --------------------------------------------------------------- */

let held = null;
let pointer = { x: 0, y: 0 };

function grabAt(x, y) {
  let best = null;
  let bestDist = 40 * 40;   // you have to click reasonably close

  for (const d of dots) {
    const dx = d.x - x;
    const dy = d.y - y;
    const dist = dx * dx + dy * dy;
    if (dist < bestDist) {
      bestDist = dist;
      best = d;
    }
  }
  return best;
}

function pointerPos(e) {
  const t = e.touches ? e.touches[0] : e;
  // screen pixels -> world units, so dragging still lines up when zoomed
  return { x: t.clientX / zoom, y: t.clientY / zoom };
}

function onDown(e) {
  const p = pointerPos(e);
  pointer = p;
  held = grabAt(p.x, p.y);
  if (held) e.preventDefault();
}

function onMove(e) {
  const p = pointerPos(e);
  pointer = p;
  if (held) e.preventDefault();
}

function onUp() {
  held = null;
}

canvas.addEventListener("mousedown", onDown);
window.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);

canvas.addEventListener("touchstart", onDown, { passive: false });
window.addEventListener("touchmove", onMove, { passive: false });
window.addEventListener("touchend", onUp);

// While you drag, the dot follows your finger - but we move oldx/oldy
// too, so when you let go it keeps the speed you were flinging it at.
function dragHeld() {
  if (!held) return;
  held.oldx = held.x;
  held.oldy = held.y;
  held.x = pointer.x;
  held.y = pointer.y;
}


/* ---------------------------------------------------------------
   DRAWING
   --------------------------------------------------------------- */

/* Faces! The face someone pulls depends on how they're feeling:

     happy  100 - 70     :)
     wobbly  70 - 35     :|
     ouch    35 -  1     :(
     knocked out    0    X X  with stars spinning round their head    */

function drawFace(d) {
  const person = d.body;
  const health = person ? person.health : 100;
  const ko     = person ? person.ko : false;
  const r = d.r;

  ctx.fillStyle = "#2b2b45";
  ctx.strokeStyle = "#2b2b45";
  ctx.lineWidth = Math.max(2, r * 0.11);
  ctx.lineCap = "round";

  const eyeY = d.y - r * 0.15;
  const eyeL = d.x - r * 0.33;
  const eyeR = d.x + r * 0.33;

  if (ko) {
    // X X eyes - draw two little crosses
    const k = r * 0.17;
    ctx.beginPath();
    for (const ex of [eyeL, eyeR]) {
      ctx.moveTo(ex - k, eyeY - k); ctx.lineTo(ex + k, eyeY + k);
      ctx.moveTo(ex + k, eyeY - k); ctx.lineTo(ex - k, eyeY + k);
    }
    ctx.stroke();

    // little "o" mouth
    ctx.beginPath();
    ctx.arc(d.x, d.y + r * 0.38, r * 0.16, 0, Math.PI * 2);
    ctx.fill();

    // stars spinning round their head
    for (let i = 0; i < 3; i++) {
      const a = person.dizzy + i * (Math.PI * 2 / 3);
      drawStar(d.x + Math.cos(a) * r * 1.5,
               d.y - r * 1.25 + Math.sin(a) * r * 0.32, r * 0.3);
    }
    return;
  }

  // ---- eyes ----
  if (health < 35) {
    // squinting in pain - two little lines
    ctx.beginPath();
    ctx.moveTo(eyeL - r * 0.16, eyeY); ctx.lineTo(eyeL + r * 0.16, eyeY);
    ctx.moveTo(eyeR - r * 0.16, eyeY); ctx.lineTo(eyeR + r * 0.16, eyeY);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(eyeL, eyeY, r * 0.22, 0, Math.PI * 2);
    ctx.arc(eyeR, eyeY, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- mouth ----
  ctx.beginPath();
  if (health >= 70) {
    // big smile
    ctx.arc(d.x, d.y + r * 0.1, r * 0.42, 0.25 * Math.PI, 0.75 * Math.PI);
  } else if (health >= 35) {
    // straight "hmm" line
    ctx.moveTo(d.x - r * 0.3, d.y + r * 0.42);
    ctx.lineTo(d.x + r * 0.3, d.y + r * 0.42);
  } else {
    // upside-down smile = frown
    ctx.arc(d.x, d.y + r * 0.75, r * 0.42, 1.25 * Math.PI, 1.75 * Math.PI);
  }
  ctx.stroke();
}

function drawStar(x, y, size) {
  ctx.fillStyle = "#ffd93d";
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const rad = i % 2 === 0 ? size : size * 0.45;
    const px = x + Math.cos(a) * rad;
    const py = y + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawHealthBar(person) {
  const head = person.head;
  if (!head) return;
  if (person.health >= 100) return;   // full health? no need for a bar

  const w = head.r * 2.4;
  const h = head.r * 0.34;
  const x = head.x - w / 2;
  const y = head.y - head.r * 2.1;

  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);

  const frac = Math.max(0, person.health) / 100;
  ctx.fillStyle = frac > 0.6 ? "#4ade80" : frac > 0.3 ? "#ffd93d" : "#ff5b5b";
  ctx.fillRect(x, y, w * frac, h);
}


function draw() {
  // Zoom! Everything after this line is drawn in world units and the
  // canvas shrinks it down to fit the screen for us.
  ctx.setTransform(zoom, 0, 0, zoom, 0, 0);

  // background
  const sky = ctx.createLinearGradient(0, 0, 0, WH);
  sky.addColorStop(0, "#2a1a5e");
  sky.addColorStop(1, "#123a63");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, WW, WH);

  // ground stripe
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.fillRect(0, WH - 30, WW, 30);

  // sticks first, so dots draw on top
  ctx.lineCap = "round";
  for (const s of sticks) {
    if (!s.visible) continue;
    ctx.strokeStyle = s.a.colour;
    ctx.lineWidth = s.thickness;
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y);
    ctx.lineTo(s.b.x, s.b.y);
    ctx.stroke();
  }

  // dots
  for (const d of dots) {
    ctx.fillStyle = d.colour;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();

    // someone who just got a bump flashes red
    if (d.body && d.body.ouch > 0) {
      ctx.fillStyle = "rgba(255, 70, 70, " + (d.body.ouch / 24) + ")";
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (d.face) drawFace(d);
  }

  // health bars float above everyone's head
  for (const person of people) drawHealthBar(person);

  // creatures get their own faces, teeth and details drawn on top
  for (const c of creatures) {
    if (c.kind === "crawler") drawCrawler(c); else drawCroc(c);
  }

  // highlight whatever you're holding
  if (held) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(held.x, held.y, held.r + 6, 0, Math.PI * 2);
    ctx.stroke();
  }
}


/* ---------------------------------------------------------------
   THE MAIN LOOP - this runs about 60 times a second, forever
   --------------------------------------------------------------- */

function loop() {
  const steps = slowMo ? 1 : 2;   // slow-mo just does less physics per frame

  for (let i = 0; i < steps; i++) {
    updateCreatures();   // the crocs decide what they're up to
    markControlled();
    dragHeld();
    moveDots();
    rememberSpeeds();    // how fast was everyone going?
    for (let k = 0; k < ITERATIONS; k++) {
      solveSticks();
      solveCollisions();
      solveWalls();
    }
    checkForBumps();     // ...and who got stopped in a hurry? OUCH.
  }

  easeSticks();

  // tick down the "just got hurt" flashes
  for (const person of people) {
    if (person.ouch > 0) person.ouch--;
    if (person.ko) person.dizzy += 0.09;
  }

  draw();
  requestAnimationFrame(loop);
}


/* ---------------------------------------------------------------
   BUTTONS
   --------------------------------------------------------------- */

const spawners = {
  ragdoll: spawnRagdoll,
  croc:    spawnCroc,
  crawler: spawnCrawler,
  ball:    spawnBall,
  box:     spawnBox,
  plank:   spawnPlank
};

document.querySelectorAll("[data-spawn]").forEach(btn => {
  btn.addEventListener("click", () => {
    const what = btn.getAttribute("data-spawn");
    // drop it in a random-ish spot near the top middle
    const x = WW / 2 + (Math.random() - 0.5) * Math.min(WW * 0.6, 500);
    const y = WTOP + 120;
    spawners[what](x, y);
    hideHint();
  });
});

const gravityBtn = document.getElementById("btn-gravity");
gravityBtn.classList.add("on");
gravityBtn.addEventListener("click", () => {
  gravityOn = !gravityOn;
  gravityBtn.classList.toggle("on", gravityOn);
});

const slowmoBtn = document.getElementById("btn-slowmo");
slowmoBtn.addEventListener("click", () => {
  slowMo = !slowMo;
  slowmoBtn.classList.toggle("on", slowMo);
});

// ---- zoom out for a MUCH bigger world ----
const ZOOM_NAMES = ["🔍 Normal", "🔍 Big", "🔍 Huge"];
const zoomBtn = document.getElementById("btn-zoom");
zoomBtn.addEventListener("click", () => {
  zoomStep = (zoomStep + 1) % ZOOMS.length;
  resize();
  zoomBtn.textContent = ZOOM_NAMES[zoomStep];
  zoomBtn.classList.toggle("on", zoomStep !== 0);
});

// ---- proper fullscreen ----
const fullBtn = document.getElementById("btn-full");
fullBtn.addEventListener("click", () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});
document.addEventListener("fullscreenchange", () => {
  const on = !!document.fullscreenElement;
  fullBtn.textContent = on ? "⛶ Exit full" : "⛶ Fullscreen";
  fullBtn.classList.toggle("on", on);
  setTimeout(resize, 120);   // give the browser a moment to settle
});

// ---- patch everyone up ----
document.getElementById("btn-heal").addEventListener("click", healEveryone);

document.getElementById("btn-clear").addEventListener("click", () => {
  dots = [];
  sticks = [];
  creatures = [];
  people = [];
  held = null;
});

let hintTimer = null;
function hideHint() {
  const hint = document.getElementById("hint");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hint.style.opacity = "0"; }, 5000);
}


// ---- Start with a couple of people so it isn't empty ----
spawnRagdoll(WW / 2 - 120, WTOP + 160);
spawnRagdoll(WW / 2 + 120, WTOP + 160);
hideHint();

loop();
</script>
