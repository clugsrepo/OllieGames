<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ollie's Playground</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #1a1040;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: rgba(26, 16, 64, 0.92);
    border-bottom: 2px solid rgba(255, 255, 255, 0.15);
    z-index: 10;
    align-items: center;
  }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: bold;
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 9px 14px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }
  button:hover  { background: rgba(255, 255, 255, 0.22); }
  button:active { transform: scale(0.94); }

  button.on {
    background: #ffd93d;
    color: #1a1040;
    border-color: #ffd93d;
  }

  .home {
    margin-left: auto;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: bold;
    color: #ffd93d;
    padding: 9px 14px;
  }

  /* squeeze the buttons up on small phone screens */
  @media (max-width: 560px) {
    #toolbar { gap: 5px; padding: 7px; }
    button   { font-size: 0.82rem; padding: 7px 9px; border-radius: 10px; }
    .home    { font-size: 0.82rem; padding: 7px 9px; }
  }

  canvas { display: block; }

  #hint {
    position: fixed;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.8s;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button data-spawn="ragdoll">🙂 Person</button>
  <button data-spawn="croc">🐊 Croc</button>
  <button data-spawn="ball">⚪ Ball</button>
  <button data-spawn="box">📦 Box</button>
  <button data-spawn="plank">➖ Plank</button>
  <button id="btn-gravity">🌍 Gravity</button>
  <button id="btn-slowmo">🐌 Slow-mo</button>
  <button id="btn-clear">🧹 Clear</button>
  <a class="home" href="../../index.html">← Home</a>
</div>

<canvas id="c"></canvas>
<p id="hint">Drag things around and fling them!</p>

<script>
/* =====================================================================
   OLLIE'S PLAYGROUND
   A ragdoll physics sandbox.

   The physics is called "Verlet integration". It sounds fancy but the
   idea is simple:

     - Everything is made of DOTS and STICKS.
     - A dot remembers where it was LAST frame. The difference between
       where it is now and where it was is its speed. Neat trick - we
       never have to store speed separately!
     - A stick joins two dots and keeps them the right distance apart.

   Join enough dots with enough sticks and you get a wobbly person.
   ===================================================================== */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// ---- Settings you can play with! ----
let GRAVITY  = 0.55;   // how hard things fall
let BOUNCE   = 0.45;   // how bouncy the floor is
let FRICTION = 0.995;  // 1 = slippery forever, lower = more drag
const ITERATIONS = 8;  // higher = stiffer, less stretchy

let gravityOn = true;
let slowMo    = false;

// ---- The world ----
let dots      = [];   // every dot in the world
let sticks    = [];   // every stick joining two dots
let creatures = [];   // things that are ALIVE and move by themselves

let W = 0, H = 0, TOP = 0;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  TOP = document.getElementById("toolbar").offsetHeight;
}
window.addEventListener("resize", resize);
resize();


/* ---------------------------------------------------------------
   MAKING DOTS AND STICKS
   --------------------------------------------------------------- */

function makeDot(x, y, radius, colour) {
  const dot = {
    x: x, y: y,
    oldx: x, oldy: y,   // where it was last frame
    r: radius || 8,
    colour: colour || "#ffd93d"
  };
  dots.push(dot);
  return dot;
}

function makeStick(a, b, visible, thickness) {
  // The stick's length is however far apart the dots start out.
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const stick = {
    a: a,
    b: b,
    length: Math.sqrt(dx * dx + dy * dy),
    visible: visible !== false,
    thickness: thickness || 10
  };
  sticks.push(stick);
  return stick;
}


/* ---------------------------------------------------------------
   THINGS WE CAN SPAWN
   --------------------------------------------------------------- */

const SKIN_COLOURS = ["#ffb37a", "#f5d0a9", "#c98a5b", "#8d5524", "#ffd1a3"];
// no green shirts - people would blend into the crocodiles!
const SHIRT_COLOURS = ["#ff6b6b", "#6bcbff", "#a06bff", "#ffd93d", "#ff8fd9", "#ff9f43"];

// Make everything bigger or smaller by changing this one number!
const SIZE = 1.6;

function spawnRagdoll(x, y) {
  const skin  = SKIN_COLOURS[Math.floor(Math.random() * SKIN_COLOURS.length)];
  const shirt = SHIRT_COLOURS[Math.floor(Math.random() * SHIRT_COLOURS.length)];

  const S = SIZE;
  // little helper so we don't have to write "* S" a hundred times
  const dot = (dx, dy, r, c) => {
    const d = makeDot(x + dx * S, y + dy * S, r * S, c);
    d.person = true;      // so crocodiles know who to chase!
    return d;
  };

  // Build the body out of dots
  const head  = dot(  0, -42, 15, skin);
  head.face = true;   // only heads get eyes and a smile
  const neck  = dot(  0, -22,  6, shirt);
  const chest = dot(  0,  -6,  9, shirt);
  const hip   = dot(  0,  18,  9, shirt);

  const elbowL = dot(-20,  -2, 6, shirt);
  const handL  = dot(-32,  16, 7, skin);
  const elbowR = dot( 20,  -2, 6, shirt);
  const handR  = dot( 32,  16, 7, skin);

  const kneeL  = dot(-11, 46, 7, "#3b5bdb");
  const footL  = dot(-13, 72, 8, "#2b2b45");
  const kneeR  = dot( 11, 46, 7, "#3b5bdb");
  const footR  = dot( 13, 72, 8, "#2b2b45");

  // Join them with sticks (the bones!)
  makeStick(head, neck,   true,  9 * S);
  makeStick(neck, chest,  true, 18 * S);
  makeStick(chest, hip,   true, 20 * S);

  makeStick(chest, elbowL, true, 9 * S);
  makeStick(elbowL, handL, true, 8 * S);
  makeStick(chest, elbowR, true, 9 * S);
  makeStick(elbowR, handR, true, 8 * S);

  makeStick(hip, kneeL,  true, 11 * S);
  makeStick(kneeL, footL, true, 10 * S);
  makeStick(hip, kneeR,  true, 11 * S);
  makeStick(kneeR, footR, true, 10 * S);

  // Invisible braces so the body doesn't fold up like a deckchair
  makeStick(head, chest, false);
  makeStick(neck, hip,   false);
  makeStick(chest, kneeL, false);
  makeStick(chest, kneeR, false);
  makeStick(elbowL, elbowR, false);   // keeps the shoulders apart
  makeStick(hip, handL, false);       // stops arms folding right through
  makeStick(hip, handR, false);
}

function spawnBall(x, y) {
  const colour = SHIRT_COLOURS[Math.floor(Math.random() * SHIRT_COLOURS.length)];
  makeDot(x, y, 26 * SIZE, colour);
}

function spawnBox(x, y) {
  const s = 30 * SIZE;
  const c = "#c98a5b";
  const tl = makeDot(x - s, y - s, 8 * SIZE, c);
  const tr = makeDot(x + s, y - s, 8 * SIZE, c);
  const br = makeDot(x + s, y + s, 8 * SIZE, c);
  const bl = makeDot(x - s, y + s, 8 * SIZE, c);

  makeStick(tl, tr, true, 14 * SIZE);
  makeStick(tr, br, true, 14 * SIZE);
  makeStick(br, bl, true, 14 * SIZE);
  makeStick(bl, tl, true, 14 * SIZE);
  makeStick(tl, br, false);   // diagonals stop it squashing flat
  makeStick(tr, bl, false);
}

function spawnPlank(x, y) {
  const w = 70 * SIZE, h = 8 * SIZE;
  const c = "#a06bff";
  const tl = makeDot(x - w, y - h, 6 * SIZE, c);
  const tr = makeDot(x + w, y - h, 6 * SIZE, c);
  const br = makeDot(x + w, y + h, 6 * SIZE, c);
  const bl = makeDot(x - w, y + h, 6 * SIZE, c);

  makeStick(tl, tr, true, 12 * SIZE);
  makeStick(tr, br, true, 12 * SIZE);
  makeStick(br, bl, true, 12 * SIZE);
  makeStick(bl, tl, true, 12 * SIZE);
  makeStick(tl, br, false);
  makeStick(tr, bl, false);
}


/* ---------------------------------------------------------------
   THE CROCODILE 🐊

   The croc is built out of dots and sticks just like everything else,
   but it's ALIVE: every frame it looks around for the nearest person,
   waddles towards them, and snaps its jaws shut.

   The clever bit is the jaw. There's an invisible stick between the top
   and bottom of the mouth called the "muscle". We just change how LONG
   that stick wants to be - long for open, short for shut - and the
   physics does the rest. That's how you make anything bend or grab.
   --------------------------------------------------------------- */

const CROC_GREEN = "#3fa34d";
const CROC_DARK  = "#2d7a38";

function spawnCroc(x, y) {
  const croc = { body: [], t: Math.random() * 10, facing: 1, turn: 0,
                 prey: null, holdTimer: 0, cooldown: 0, stuck: 0, lastX: x };

  const S = SIZE;
  const dir = Math.random() < 0.5 ? 1 : -1;   // facing left or right
  croc.facing = dir;

  // helper: place a dot using croc-shaped coordinates
  const dot = (dx, dy, r, c) => {
    const d = makeDot(x + dx * S * dir, y + dy * S, r * S, c);
    d.owner = croc;          // so the croc never bites itself
    croc.body.push(d);
    return d;
  };

  // spine, from tail to nose
  const tail = dot(-92,  0,  5, CROC_DARK);
  const b3   = dot(-62,  0,  9, CROC_GREEN);
  const b2   = dot(-32,  0, 11, CROC_GREEN);
  const b1   = dot(  0,  0, 11, CROC_GREEN);
  const neck = dot( 26,  0, 10, CROC_GREEN);
  const hinge= dot( 46,  2,  9, CROC_GREEN);

  // the two jaw tips
  const upperTip = dot(102, -5, 5, CROC_GREEN);
  const lowerTip = dot(102, 11, 5, CROC_DARK);

  // stubby little legs
  const frontFoot = dot(  6, 24, 6, CROC_DARK);
  const backFoot  = dot(-56, 24, 6, CROC_DARK);

  // ---- the body ----
  makeStick(tail, b3,  true, 11 * S);
  makeStick(b3, b2,    true, 19 * S);
  makeStick(b2, b1,    true, 22 * S);
  makeStick(b1, neck,  true, 20 * S);
  makeStick(neck, hinge, true, 17 * S);

  // ---- the jaws ----
  makeStick(hinge, upperTip, true, 11 * S);   // top of the mouth
  makeStick(hinge, lowerTip, true,  9 * S);   // bottom of the mouth

  // The TOP jaw is bolted to his body so his snout stays pointing
  // forwards instead of drooping into the floor. Only the BOTTOM jaw
  // swings - which is how a real croc does it anyway.
  makeStick(neck, upperTip, false);
  makeStick(b1,   upperTip, false);

  // THE MUSCLE - we change this length to open and close the mouth
  croc.muscle = makeStick(upperTip, lowerTip, false);
  croc.openLen   = 46 * S;
  croc.closedLen = 13 * S;

  // ---- legs ----
  makeStick(b1, frontFoot, true, 9 * S);
  makeStick(b3, backFoot,  true, 9 * S);
  makeStick(neck, frontFoot, false);   // stops the legs splaying about
  makeStick(b2, backFoot,  false);

  // ---- invisible braces to keep him croc-shaped ----
  makeStick(tail, b2,  false);
  makeStick(b3, b1,    false);
  makeStick(b2, neck,  false);
  makeStick(b1, hinge, false);

  croc.hinge = hinge;
  croc.neck  = neck;
  croc.upperTip = upperTip;
  croc.lowerTip = lowerTip;

  creatures.push(croc);
  return croc;
}


const CROC_SPEED = 1.1;   // how fast he can waddle (bigger = zoomier croc!)

function updateCreatures() {
  for (const c of creatures) {
    const U = c.upperTip, L = c.lowerTip;

    // the middle of his mouth - this is where he grabs things
    const mouthX = (U.x + L.x) / 2;
    const mouthY = (U.y + L.y) / 2;

    if (c.cooldown > 0) c.cooldown--;

    // ---- is he already carrying someone? ----
    if (c.prey) {
      c.muscle.length = c.closedLen;      // keep the mouth shut!
      c.prey.x = mouthX;
      c.prey.y = mouthY;

      c.holdTimer--;
      if (c.holdTimer <= 0) {
        // THROW! (in Verlet, moving oldx/oldy is how you set speed)
        c.prey.oldx = c.prey.x + c.facing * 3;
        c.prey.oldy = c.prey.y + 10;
        c.prey = null;
        c.cooldown = 100;                 // have a little rest first
      }
      continue;
    }

    // ---- look for the nearest bit of a person to chase ----
    // (any bit will do - a hand or a foot is just as good as a head!)
    let target = null, bestDist = Infinity;
    for (const d of dots) {
      if (!d.person) continue;
      const dx = d.x - mouthX, dy = d.y - mouthY;
      const dist = dx * dx + dy * dy;
      if (dist < bestDist) { bestDist = dist; target = d; }
    }

    if (!target) {
      // nobody about - just laze around opening and closing his mouth
      c.t += 0.015;
      const yawn = 0.5 + 0.5 * Math.sin(c.t);
      c.muscle.length = c.closedLen + (c.openLen - c.closedLen) * yawn * 0.45;
      continue;
    }

    bestDist = Math.sqrt(bestDist);

    // where's the middle of the croc?
    let cx = 0;
    for (const d of c.body) cx += d.x;
    cx /= c.body.length;

    const bodyDir = c.hinge.x >= cx ? 1 : -1;   // way he's pointing
    const wantDir = target.x >= cx ? 1 : -1;    // way dinner is
    if (c.turn > 0) c.turn--;

    // A croc can't walk backwards! If his dinner is behind him he has to
    // spin right round. We flip every dot to the other side of his middle.
    if (bodyDir !== wantDir && c.turn <= 0 && Math.abs(target.x - cx) > 40 * SIZE) {
      for (const d of c.body) {
        d.x    = 2 * cx - d.x;
        d.oldx = 2 * cx - d.oldx;   // mirror his speed too, or he'd jolt
      }
      c.turn = 45;
    }

    c.facing = c.hinge.x >= cx ? 1 : -1;

    // ---- waddle forwards ----
    // We give him a nudge each step, but stop nudging once he's at top
    // speed - otherwise he'd get faster and faster forever!
    if (c.facing === wantDir) {
      for (const d of c.body) {
        const vx = d.x - d.oldx;
        if (c.facing > 0 ? vx < CROC_SPEED : vx > -CROC_SPEED) {
          d.x += c.facing * 0.05;
        }
      }
    }

    // If he's wedged against something, he lifts his HEAD to climb over it.
    // (We only lift the front of him - lifting all of him made him rear up
    // like a horse, which was funny but not very crocodile.)
    if (Math.abs(c.hinge.x - c.lastX) < 0.4) c.stuck++; else c.stuck = 0;
    c.lastX = c.hinge.x;
    if (c.stuck > 40) {
      for (const d of [c.neck, c.hinge, c.upperTip, c.lowerTip]) d.y -= 4.5 * SIZE;
      c.stuck = 0;
    }

    // ---- CHOMP ----
    if (bestDist < 46 * SIZE && c.cooldown <= 0) {
      c.muscle.length = c.closedLen;

      // did anything end up inside his mouth?
      const grabR = 40 * SIZE;
      for (const d of dots) {
        // never grab another croc - two crocs tugging the same dot
        // would fight each other forever
        if (d.owner || d === held || d.controlled) continue;
        const gx = d.x - mouthX, gy = d.y - mouthY;
        if (gx * gx + gy * gy < grabR * grabR) {
          c.prey = d;
          c.holdTimer = 75;
          break;
        }
      }
    } else if (bestDist < 150 * SIZE) {
      c.muscle.length = c.openLen;        // getting close - open wide!
    } else {
      c.muscle.length = c.closedLen * 1.6; // still far off - mouth mostly shut
    }
  }
}


function drawCroc(c) {
  const H = c.hinge, N = c.neck, U = c.upperTip, L = c.lowerTip;

  // which way is the head pointing?
  let hx = H.x - N.x, hy = H.y - N.y;
  const hlen = Math.hypot(hx, hy) || 1;
  hx /= hlen; hy /= hlen;

  // A line at right angles to his head. There are two ways it could
  // point, so we pick the one pointing away from his bottom jaw - that
  // way it always finds his BACK, even if he's upside down.
  let px = -hy, py = hx;
  if ((L.x - U.x) * px + (L.y - U.y) * py > 0) { px = -px; py = -py; }

  // ---- teeth ----
  ctx.fillStyle = "#fff";
  const jaw = (from, to, towardX, towardY) => {
    let jx = to.x - from.x, jy = to.y - from.y;
    const jlen = Math.hypot(jx, jy) || 1;
    jx /= jlen; jy /= jlen;

    // teeth stick out sideways from the jaw, pointing into the mouth
    let qx = -jy, qy = jx;
    if (qx * towardX + qy * towardY < 0) { qx = -qx; qy = -qy; }

    for (let t = 0.32; t < 0.95; t += 0.17) {
      const bx = from.x + jx * jlen * t;
      const by = from.y + jy * jlen * t;
      const w = 3.2 * SIZE, h = 7 * SIZE;
      ctx.beginPath();
      ctx.moveTo(bx - jx * w, by - jy * w);
      ctx.lineTo(bx + jx * w, by + jy * w);
      ctx.lineTo(bx + qx * h, by + qy * h);
      ctx.closePath();
      ctx.fill();
    }
  };
  jaw(H, U, -px, -py);   // top teeth point down into the mouth
  jaw(H, L,  px,  py);   // bottom teeth point up into the mouth

  // ---- bumpy scales along his back ----
  ctx.fillStyle = CROC_DARK;
  const spine = c.body.slice(0, 5);
  for (const d of spine) {
    ctx.beginPath();
    ctx.arc(d.x + px * d.r * 0.7, d.y + py * d.r * 0.7, d.r * 0.42, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- eye, sitting on top of his head ----
  const ex = H.x + px * 9 * SIZE - hx * 3 * SIZE;
  const ey = H.y + py * 9 * SIZE - hy * 3 * SIZE;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(ex, ey, 6.5 * SIZE, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a1a2e";
  ctx.beginPath();
  ctx.arc(ex + hx * 1.5 * SIZE, ey + hy * 1.5 * SIZE, 4.2 * SIZE, 0, Math.PI * 2);
  ctx.fill();

  // ---- nostril on the end of his snout ----
  ctx.fillStyle = CROC_DARK;
  ctx.beginPath();
  ctx.arc(U.x - hx * 5 * SIZE + px * 3 * SIZE, U.y - hy * 5 * SIZE + py * 3 * SIZE,
          2.4 * SIZE, 0, Math.PI * 2);
  ctx.fill();
}


/* ---------------------------------------------------------------
   THE PHYSICS
   --------------------------------------------------------------- */

// A dot is "controlled" when something is holding it in place - either
// your finger, or a crocodile's mouth. Controlled dots ignore gravity and
// can't be shoved around by sticks or bumps.
function markControlled() {
  for (const d of dots) d.controlled = false;
  if (held) held.controlled = true;
  for (const c of creatures) if (c.prey) c.prey.controlled = true;
}

// STEP 1: move every dot
function moveDots() {
  const g = gravityOn ? GRAVITY : 0;

  for (const d of dots) {
    if (d.controlled) continue;   // being held - we'll place it ourselves

    // speed = how far it moved last frame
    let vx = (d.x - d.oldx) * FRICTION;
    let vy = (d.y - d.oldy) * FRICTION;

    d.oldx = d.x;
    d.oldy = d.y;

    d.x += vx;
    d.y += vy + g;
  }
}

// STEP 2: make sure sticks stay the right length
function solveSticks() {
  for (const s of sticks) {
    const dx = s.b.x - s.a.x;
    const dy = s.b.y - s.a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;

    // How far off are we? Share the fix between both dots.
    const diff = (s.length - dist) / dist * 0.5;
    const offx = dx * diff;
    const offy = dy * diff;

    if (!s.a.controlled) { s.a.x -= offx; s.a.y -= offy; }
    if (!s.b.controlled) { s.b.x += offx; s.b.y += offy; }
  }
}

// STEP 3: stop dots overlapping each other (so stuff piles up)
function solveCollisions() {
  for (let i = 0; i < dots.length; i++) {
    const a = dots[i];
    for (let j = i + 1; j < dots.length; j++) {
      const b = dots[j];

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const minDist = a.r + b.r;

      // quick reject before doing the expensive square root
      if (Math.abs(dx) > minDist || Math.abs(dy) > minDist) continue;

      const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      if (dist >= minDist) continue;

      const push = (minDist - dist) / dist * 0.5;
      const offx = dx * push;
      const offy = dy * push;

      if (!a.controlled) { a.x -= offx; a.y -= offy; }
      if (!b.controlled) { b.x += offx; b.y += offy; }
    }
  }
}

// STEP 4: keep everything inside the walls
function solveWalls() {
  for (const d of dots) {
    // floor
    if (d.y + d.r > H) {
      const vy = d.y - d.oldy;
      d.y = H - d.r;
      d.oldy = d.y + vy * BOUNCE;
    }
    // ceiling (just under the toolbar)
    if (d.y - d.r < TOP) {
      const vy = d.y - d.oldy;
      d.y = TOP + d.r;
      d.oldy = d.y + vy * BOUNCE;
    }
    // left wall
    if (d.x - d.r < 0) {
      const vx = d.x - d.oldx;
      d.x = d.r;
      d.oldx = d.x + vx * BOUNCE;
    }
    // right wall
    if (d.x + d.r > W) {
      const vx = d.x - d.oldx;
      d.x = W - d.r;
      d.oldx = d.x + vx * BOUNCE;
    }
  }
}


/* ---------------------------------------------------------------
   DRAGGING WITH MOUSE OR FINGER
   --------------------------------------------------------------- */

let held = null;
let pointer = { x: 0, y: 0 };

function grabAt(x, y) {
  let best = null;
  let bestDist = 40 * 40;   // you have to click reasonably close

  for (const d of dots) {
    const dx = d.x - x;
    const dy = d.y - y;
    const dist = dx * dx + dy * dy;
    if (dist < bestDist) {
      bestDist = dist;
      best = d;
    }
  }
  return best;
}

function pointerPos(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

function onDown(e) {
  const p = pointerPos(e);
  pointer = p;
  held = grabAt(p.x, p.y);
  if (held) e.preventDefault();
}

function onMove(e) {
  const p = pointerPos(e);
  pointer = p;
  if (held) e.preventDefault();
}

function onUp() {
  held = null;
}

canvas.addEventListener("mousedown", onDown);
window.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);

canvas.addEventListener("touchstart", onDown, { passive: false });
window.addEventListener("touchmove", onMove, { passive: false });
window.addEventListener("touchend", onUp);

// While you drag, the dot follows your finger - but we move oldx/oldy
// too, so when you let go it keeps the speed you were flinging it at.
function dragHeld() {
  if (!held) return;
  held.oldx = held.x;
  held.oldy = held.y;
  held.x = pointer.x;
  held.y = pointer.y;
}


/* ---------------------------------------------------------------
   DRAWING
   --------------------------------------------------------------- */

function draw() {
  // background
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#2a1a5e");
  sky.addColorStop(1, "#123a63");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // ground stripe
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.fillRect(0, H - 30, W, 30);

  // sticks first, so dots draw on top
  ctx.lineCap = "round";
  for (const s of sticks) {
    if (!s.visible) continue;
    ctx.strokeStyle = s.a.colour;
    ctx.lineWidth = s.thickness;
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y);
    ctx.lineTo(s.b.x, s.b.y);
    ctx.stroke();
  }

  // dots
  for (const d of dots) {
    ctx.fillStyle = d.colour;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();

    // heads get eyes and a smile
    if (d.face) {
      const eye = d.r * 0.22;
      ctx.fillStyle = "#2b2b45";
      ctx.beginPath();
      ctx.arc(d.x - d.r * 0.33, d.y - d.r * 0.15, eye, 0, Math.PI * 2);
      ctx.arc(d.x + d.r * 0.33, d.y - d.r * 0.15, eye, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#2b2b45";
      ctx.lineWidth = Math.max(2, d.r * 0.11);
      ctx.beginPath();
      ctx.arc(d.x, d.y + d.r * 0.1, d.r * 0.42, 0.25 * Math.PI, 0.75 * Math.PI);
      ctx.stroke();
    }
  }

  // crocs get eyes, teeth and scales drawn on top
  for (const c of creatures) drawCroc(c);

  // highlight whatever you're holding
  if (held) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(held.x, held.y, held.r + 6, 0, Math.PI * 2);
    ctx.stroke();
  }
}


/* ---------------------------------------------------------------
   THE MAIN LOOP - this runs about 60 times a second, forever
   --------------------------------------------------------------- */

function loop() {
  const steps = slowMo ? 1 : 2;   // slow-mo just does less physics per frame

  for (let i = 0; i < steps; i++) {
    updateCreatures();   // the crocs decide what they're up to
    markControlled();
    dragHeld();
    moveDots();
    for (let k = 0; k < ITERATIONS; k++) {
      solveSticks();
      solveCollisions();
      solveWalls();
    }
  }

  draw();
  requestAnimationFrame(loop);
}


/* ---------------------------------------------------------------
   BUTTONS
   --------------------------------------------------------------- */

const spawners = {
  ragdoll: spawnRagdoll,
  croc:    spawnCroc,
  ball:    spawnBall,
  box:     spawnBox,
  plank:   spawnPlank
};

document.querySelectorAll("[data-spawn]").forEach(btn => {
  btn.addEventListener("click", () => {
    const what = btn.getAttribute("data-spawn");
    // drop it in a random-ish spot near the top middle
    const x = W / 2 + (Math.random() - 0.5) * Math.min(W * 0.6, 400);
    const y = TOP + 120;
    spawners[what](x, y);
    hideHint();
  });
});

const gravityBtn = document.getElementById("btn-gravity");
gravityBtn.classList.add("on");
gravityBtn.addEventListener("click", () => {
  gravityOn = !gravityOn;
  gravityBtn.classList.toggle("on", gravityOn);
});

const slowmoBtn = document.getElementById("btn-slowmo");
slowmoBtn.addEventListener("click", () => {
  slowMo = !slowMo;
  slowmoBtn.classList.toggle("on", slowMo);
});

document.getElementById("btn-clear").addEventListener("click", () => {
  dots = [];
  sticks = [];
  creatures = [];
  held = null;
});

let hintTimer = null;
function hideHint() {
  const hint = document.getElementById("hint");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hint.style.opacity = "0"; }, 5000);
}


// ---- Start with a couple of people so it isn't empty ----
spawnRagdoll(W / 2 - 120, TOP + 160);
spawnRagdoll(W / 2 + 120, TOP + 160);
hideHint();

loop();
</script>
