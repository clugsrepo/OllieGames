<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melon Clicker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #1a1040;
    background-image:
      radial-gradient(circle at 20% 15%, #3b1d7a 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #0f4c81 0%, transparent 50%);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  /* stop iOS zooming when you tap fast */
  body { touch-action: manipulation; }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 16px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* ---------- top bar ---------- */
  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .topbar a, .iconbtn {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: bold;
    color: #ffd93d;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 7px 11px;
    text-decoration: none;
    cursor: pointer;
  }
  .iconbtn:hover, .topbar a:hover { background: rgba(255,255,255,0.18); }
  .spacer { margin-left: auto; }

  /* ---------- the big counter ---------- */
  .counter {
    text-align: center;
    margin: 18px 0 4px;
  }
  #coins {
    font-size: clamp(2.6rem, 12vw, 4.2rem);
    font-weight: bold;
    line-height: 1;
    color: #ffd93d;
    text-shadow: 0 0 26px rgba(255,217,61,0.35);
    display: inline-block;
    transition: transform 0.08s ease-out;
  }
  #coins.bump { transform: scale(1.09); }

  .coinword {
    font-size: 1.15rem;
    color: #c9c2ff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .rate {
    margin-top: 6px;
    font-size: 0.9rem;
    color: #9d95cc;
    min-height: 1.2em;
  }

  /* ---------- Ollie's star ---------- */
  .clickzone {
    position: relative;
    margin: 22px 0 10px;
    width: 280px;
    height: 280px;
    display: grid;
    place-items: center;
  }

  #star {
    width: 250px;
    height: 250px;
    cursor: pointer;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.55))
            drop-shadow(0 0 26px rgba(255,240,90,0.40));
    -webkit-user-drag: none;
    animation: bob 3.4s ease-in-out infinite;
    transition: transform 0.09s cubic-bezier(.34,1.56,.64,1);
    border: none;
    background: none;
    padding: 0;
  }
  #star:active, #star.squish { transform: scale(0.88); }
  #star:focus-visible { outline: 3px solid #fff; outline-offset: 10px; border-radius: 20px; }

  @keyframes bob {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -6px; }
  }

  .tap-hint {
    color: #9d95cc;
    font-size: 0.95rem;
    margin-top: 2px;
    transition: opacity 0.6s;
  }

  /* ---------- flying bits ---------- */
  .pop, .coin {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
  }
  .pop {
    font-weight: bold;
    font-size: 1.6rem;
    /* white, not yellow - yellow text on a yellow star is invisible */
    color: #fff;
    text-shadow: 0 0 4px #000, 0 2px 7px rgba(0,0,0,0.9);
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    18%  { transform: translate(-50%, -70%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -180%) scale(1); opacity: 0; }
  }

  .coin {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe680, #f0a500 65%, #b87600);
    box-shadow: 0 0 6px rgba(255,200,60,0.55);
  }

  /* ---------- stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    margin-top: 18px;
  }
  .stat {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .stat .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9d95cc;
  }
  .stat .value {
    font-size: 1.35rem;
    font-weight: bold;
    margin-top: 3px;
  }

  /* ---------- upgrades (coming soon) ---------- */
  .panel {
    width: 100%;
    margin-top: 16px;
    background: rgba(255,255,255,0.05);
    border: 2px dashed rgba(255,255,255,0.22);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
  }
  .panel h2 { font-size: 1.15rem; margin-bottom: 12px; }

  /* ---------- shop buttons ---------- */
  .upgrade {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    font-family: inherit;
    color: #fff;
    background: rgba(255,255,255,0.09);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
  }
  .upgrade:last-child { margin-bottom: 0; }

  /* you can afford it - make it obvious */
  .upgrade.afford {
    border-color: #ffd93d;
    background: rgba(255,217,61,0.14);
  }
  .upgrade.afford:hover { background: rgba(255,217,61,0.24); }
  .upgrade:active { transform: scale(0.97); }

  /* too expensive - dim it and switch off the pointer */
  .upgrade:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .up-icon { font-size: 1.7rem; }
  .up-text { display: flex; flex-direction: column; flex: 1; }
  .up-name { font-weight: bold; font-size: 1.02rem; }
  .up-desc { font-size: 0.8rem; color: #c9c2ff; margin-top: 1px; }
  .up-owned { font-size: 0.72rem; color: #9d95cc; margin-top: 3px; }

  .up-cost {
    font-weight: bold;
    font-size: 1.05rem;
    color: #ffd93d;
    white-space: nowrap;
  }
  .up-cost::before { content: "🪙 "; }

  @media (max-width: 380px) {
    .up-desc { display: none; }
  }

  footer {
    margin-top: auto;
    padding-top: 22px;
    font-size: 0.8rem;
    color: #7a72a8;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← Home</a>
    <button class="iconbtn spacer" id="btn-sound" title="Sound on or off">🔊 Sound</button>
    <button class="iconbtn" id="btn-reset" title="Start again from zero">🗑️ Reset</button>
  </div>

  <div class="counter">
    <div id="coins">0</div>
    <div class="coinword">🪙 Coins</div>
    <div class="rate" id="rate"></div>
  </div>

  <div class="clickzone" id="clickzone">
    <!-- Ollie drew this star himself. The background was chopped off
         it so it sits properly on the dark page. -->
    <img id="star" src="star.png" alt="Ollie's star - tap it!"
         role="button" tabindex="0" draggable="false">
  </div>

  <p class="tap-hint" id="hint">Tap the star!</p>

  <div class="stats">
    <div class="stat">
      <div class="label">Per tap</div>
      <div class="value" id="per-click">1</div>
    </div>
    <div class="stat">
      <div class="label">Per second</div>
      <div class="value" id="per-second">0</div>
    </div>
    <div class="stat">
      <div class="label">Total taps</div>
      <div class="value" id="total-clicks">0</div>
    </div>
  </div>

  <div class="panel">
    <h2>🛒 Upgrades</h2>

    <button class="upgrade" id="buy-click">
      <span class="up-icon">✨</span>
      <span class="up-text">
        <span class="up-name">Star Power</span>
        <span class="up-desc">Your star shines brighter &mdash; +1 coin per tap</span>
        <span class="up-owned" id="click-owned">You have 0</span>
      </span>
      <span class="up-cost" id="click-cost">10</span>
    </button>

    <button class="upgrade" id="buy-auto">
      <span class="up-icon">🌠</span>
      <span class="up-text">
        <span class="up-name">Shooting Stars</span>
        <span class="up-desc">Stars fly past on their own &mdash; +1 coin a second</span>
        <span class="up-owned" id="auto-owned">You have 0</span>
      </span>
      <span class="up-cost" id="auto-cost">25</span>
    </button>
  </div>

  <footer>Your coins are saved on this device automatically.</footer>
</div>

<script src="../../shared/player.js"></script>
<script src="../../shared/admin-panel.js"></script>
<script>
/* =====================================================================
   MELON CLICKER
   Tap the star, get coins. Simple as that (for now!).

   Everything is saved in something called "localStorage", which is a
   little notepad the browser keeps for our game. Close the page, come
   back tomorrow, and your coins are still there.
   ===================================================================== */

const SAVE_KEY = "ollie-melon-clicker-v1";

// ---- the whole game state lives in here ----
let game = {
  coins: 0,
  perClick: 1,
  perSecond: 0,
  clickLevel: 0,      // how many "Star Power" upgrades you've bought
  autoLevel: 0,       // how many "Shooting Stars" you've bought
  totalClicks: 0,
  soundOn: true
};

/* ---------------------------------------------------------------
   THE SHOP

   Each upgrade starts cheap and gets dearer every time you buy it -
   otherwise you'd buy a hundred at once and the game would be over in
   a minute.

   The price is:   start price  x  1.25  for each one you already own

   So Star Power goes 10, 13, 16, 20, 25, 31, 39... It creeps up
   slowly at first and then really takes off. That's an EXPONENTIAL,
   and it's the reason clicker games can keep going forever.
   --------------------------------------------------------------- */

const UPGRADES = {
  click: { start: 10, growth: 1.25 },   // "Star Power"     +1 coin per tap
  auto:  { start: 25, growth: 1.30 }    // "Shooting Stars" +1 coin per second
};

function costOf(which) {
  const u = UPGRADES[which];
  const owned = which === "click" ? game.clickLevel : game.autoLevel;
  return Math.ceil(u.start * Math.pow(u.growth, owned));
}

// ---- bits of the page we talk to ----
const star       = document.getElementById("star");
const clickzone  = document.getElementById("clickzone");
const coinsEl    = document.getElementById("coins");
const perClickEl = document.getElementById("per-click");
const perSecEl   = document.getElementById("per-second");
const buyClick   = document.getElementById("buy-click");
const buyAuto    = document.getElementById("buy-auto");
const clicksEl   = document.getElementById("total-clicks");
const rateEl     = document.getElementById("rate");
const hintEl     = document.getElementById("hint");
const soundBtn   = document.getElementById("btn-sound");


/* ---------------------------------------------------------------
   SAVING AND LOADING
   --------------------------------------------------------------- */

function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(game));
  } catch (e) {
    // Some browsers block storage (private mode). The game still works,
    // it just won't remember anything - so don't crash over it.
  }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);

    // Only take numbers we trust. If the save file is damaged or someone
    // has fiddled with it, fall back to a sensible value instead of
    // ending up with "NaN coins" forever.
    // We used to call these Mels. Old saved games still use that name,
    // so read whichever one is in there - nobody should lose their coins
    // just because we renamed them.
    game.coins       = safeNumber(saved.coins !== undefined ? saved.coins : saved.mels, 0);
    /* If a save has no levels in it, it's from before the shop existed.
       Work the levels back out from the power it recorded, so nobody
       loses upgrades they'd already earned just because we changed how
       we store them. Taking someone's stuff away is never acceptable. */
    game.clickLevel  = Math.floor(safeNumber(saved.clickLevel,
                         Math.max(0, safeNumber(saved.perClick, 1) - 1)));
    game.autoLevel   = Math.floor(safeNumber(saved.autoLevel,
                         safeNumber(saved.perSecond, 0)));
    game.totalClicks = safeNumber(saved.totalClicks, 0);
    game.soundOn     = saved.soundOn !== false;

    // Work these two out from the levels rather than trusting the saved
    // numbers. If they ever disagreed - an older save, or someone
    // editing the file - the levels are the honest answer.
    game.perClick  = 1 + game.clickLevel;
    game.perSecond = game.autoLevel;
  } catch (e) {
    // broken save - just start fresh
  }
}

function safeNumber(value, fallback) {
  const n = Number(value);
  return Number.isFinite(n) && n >= 0 ? n : fallback;
}


/* ---------------------------------------------------------------
   SHOWING NUMBERS NICELY
   1234  ->  1,234
   1500000 -> 1.5M      (ready for when the upgrades get silly)
   --------------------------------------------------------------- */

function pretty(n) {
  n = Math.floor(n);
  if (n < 1000000)    return n.toLocaleString("en-GB");
  if (n < 1000000000) return (n / 1000000).toFixed(2).replace(/\.?0+$/, "") + "M";
  return (n / 1000000000).toFixed(2).replace(/\.?0+$/, "") + "B";
}

function refresh() {
  coinsEl.textContent    = pretty(game.coins);
  perClickEl.textContent = pretty(game.perClick);
  perSecEl.textContent   = pretty(game.perSecond);
  clicksEl.textContent   = pretty(game.totalClicks);
  refreshShop();
}

function refreshShop() {
  const purse = Math.floor(game.coins);

  const clickCost = costOf("click");
  document.getElementById("click-cost").textContent  = pretty(clickCost);
  document.getElementById("click-owned").textContent = "You have " + game.clickLevel;
  buyClick.disabled = purse < clickCost;
  buyClick.classList.toggle("afford", purse >= clickCost);

  const autoCost = costOf("auto");
  document.getElementById("auto-cost").textContent  = pretty(autoCost);
  document.getElementById("auto-owned").textContent = "You have " + game.autoLevel;
  buyAuto.disabled = purse < autoCost;
  buyAuto.classList.toggle("afford", purse >= autoCost);
}

function buy(which) {
  const cost = costOf(which);

  // Check the price again here, not just on the button. Never trust the
  // button - it could be out of date, or someone could call buy() from
  // the browser console to cheat.
  if (Math.floor(game.coins) < cost) return false;

  game.coins -= cost;

  if (which === "click") {
    game.clickLevel++;
    game.perClick = 1 + game.clickLevel;
  } else {
    game.autoLevel++;
    game.perSecond = game.autoLevel;
  }

  refresh();
  buySound();
  save();
  return true;
}

buyClick.addEventListener("click", () => buy("click"));
buyAuto.addEventListener("click",  () => buy("auto"));


/* ---------------------------------------------------------------
   TAPPING THE STAR
   --------------------------------------------------------------- */

let bumpTimer = null;
let squishTimer = null;

function tapStar(x, y) {
  game.coins       += game.perClick;
  game.totalClicks += 1;

  refresh();
  recordTapTime();

  // make the number go "pop"
  coinsEl.classList.add("bump");
  clearTimeout(bumpTimer);
  bumpTimer = setTimeout(() => coinsEl.classList.remove("bump"), 90);

  // squash the star (needed as well as :active, because :active
  // doesn't fire when you tap with a keyboard)
  star.classList.add("squish");
  clearTimeout(squishTimer);
  squishTimer = setTimeout(() => star.classList.remove("squish"), 95);

  showPop(x, y);
  spitCoins(x, y);
  blip();

  if (game.totalClicks === 1) hintEl.style.opacity = "0";

  saveSoon();
}

// Don't write to storage on every single tap - if you're clicking fast
// that's hundreds of writes a second. Wait until things go quiet.
let saveTimer = null;
function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}


/* ---------------------------------------------------------------
   THE FUN BITS - floating numbers and flying coins
   --------------------------------------------------------------- */

const MAX_BITS = 40;      // never have more than this many on screen
let liveBits = 0;

function showPop(x, y) {
  if (liveBits > MAX_BITS) return;
  liveBits++;

  const el = document.createElement("div");
  el.className = "pop";
  el.textContent = "+" + pretty(game.perClick);
  el.style.left = x + "px";
  el.style.top  = y + "px";
  clickzone.appendChild(el);

  setTimeout(() => { el.remove(); liveBits--; }, 950);
}

function spitCoins(x, y) {
  if (liveBits > MAX_BITS) return;

  for (let i = 0; i < 5; i++) {
    liveBits++;
    const coin = document.createElement("div");
    coin.className = "coin";
    coin.style.left = x + "px";
    coin.style.top  = y + "px";
    clickzone.appendChild(coin);

    // fling each coin off in its own direction
    const angle = Math.random() * Math.PI * 2;
    const dist  = 60 + Math.random() * 70;
    const dx    = Math.cos(angle) * dist;
    const dy    = Math.sin(angle) * dist - 30;   // a bit of "up"
    const spin  = (Math.random() * 720 - 360);

    coin.animate(
      [
        { transform: "translate(-50%,-50%) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx - 50}%, ${dy}%) rotate(${spin}deg)`,
          opacity: 0 }
      ],
      { duration: 620 + Math.random() * 220, easing: "cubic-bezier(.2,.7,.4,1)" }
    );

    setTimeout(() => { coin.remove(); liveBits--; }, 900);
  }
}


/* ---------------------------------------------------------------
   COINS PER SECOND - just so you can see how fast you're going
   --------------------------------------------------------------- */

let tapTimes = [];

function recordTapTime() {
  tapTimes.push(performance.now());
  if (tapTimes.length > 60) tapTimes.shift();
}

setInterval(() => {
  const now = performance.now();
  tapTimes = tapTimes.filter(t => now - t < 3000);   // last 3 seconds

  if (tapTimes.length < 2) {
    rateEl.textContent = game.perSecond > 0
      ? pretty(game.perSecond) + " coins per second"
      : "";
    return;
  }
  const fromTapping = (tapTimes.length / 3) * game.perClick;
  rateEl.textContent = pretty(Math.round(fromTapping + game.perSecond))
                     + " coins per second";
}, 400);


/* ---------------------------------------------------------------
   THE AUTO TAPPER - coins that arrive on their own

   We don't just add perSecond every second. If you switch to another
   tab, browsers slow timers right down, and you'd be robbed of coins.
   Instead we look at the CLOCK and work out how much time really went
   by since last time. Slow timer, fast timer, doesn't matter - the
   sums come out the same.
   --------------------------------------------------------------- */

let lastTick = performance.now();

setInterval(() => {
  const now = performance.now();
  const secondsPassed = (now - lastTick) / 1000;
  lastTick = now;

  if (game.perSecond <= 0) return;

  game.coins += game.perSecond * secondsPassed;
  refresh();
  saveSoon();
}, 100);


/* ---------------------------------------------------------------
   A LITTLE POP SOUND, made from scratch - no sound files needed
   --------------------------------------------------------------- */

let audio = null;

function blip() {
  if (!game.soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();

    const osc  = audio.createOscillator();
    const gain = audio.createGain();

    // slightly different note each time, so it doesn't get annoying
    osc.type = "triangle";
    osc.frequency.setValueAtTime(420 + Math.random() * 130, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audio.currentTime + 0.08);

    gain.gain.setValueAtTime(0.09, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.12);

    osc.connect(gain).connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.13);
  } catch (e) {
    // no sound available - never mind, the game still works
  }
}


// a happier two-note "ker-ching!" when you buy an upgrade
function buySound() {
  if (!game.soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();

    [660, 990].forEach((note, i) => {
      const osc  = audio.createOscillator();
      const gain = audio.createGain();
      const at   = audio.currentTime + i * 0.09;

      osc.type = "triangle";
      osc.frequency.setValueAtTime(note, at);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.11, at + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);

      osc.connect(gain).connect(audio.destination);
      osc.start(at);
      osc.stop(at + 0.2);
    });
  } catch (e) {
    // no sound available - never mind
  }
}


/* ---------------------------------------------------------------
   LISTENING FOR TAPS
   --------------------------------------------------------------- */

// "pointerdown" covers mouse, finger and stylus all at once, and it
// fires straight away instead of waiting to see if it's a double-tap.
star.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const box = clickzone.getBoundingClientRect();
  tapStar(e.clientX - box.left, e.clientY - box.top);
});

// space or enter works too
star.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    tapStar(clickzone.clientWidth / 2, clickzone.clientHeight / 2);
  }
});

// stop the page scrolling about when you tap fast on a phone
star.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
// stop the picture being dragged off the page like a file
star.addEventListener("dragstart", e => e.preventDefault());


/* ---------------------------------------------------------------
   BUTTONS
   --------------------------------------------------------------- */

soundBtn.addEventListener("click", () => {
  game.soundOn = !game.soundOn;
  soundBtn.textContent = game.soundOn ? "🔊 Sound" : "🔇 Muted";
  save();
});

document.getElementById("btn-reset").addEventListener("click", () => {
  const total = pretty(game.coins);
  if (!confirm("Start again from zero?\n\nYou will lose all " + total + " coins!")) return;
  game = { coins: 0, perClick: 1, perSecond: 0, clickLevel: 0, autoLevel: 0,
           totalClicks: 0, soundOn: game.soundOn };
  tapTimes = [];
  hintEl.style.opacity = "1";
  refresh();
  save();
});

// save on the way out, just in case
window.addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") save();
});


/* ---------------------------------------------------------------
   GO!
   --------------------------------------------------------------- */

load();
soundBtn.textContent = game.soundOn ? "🔊 Sound" : "🔇 Muted";
if (game.totalClicks > 0) hintEl.style.opacity = "0";
refresh();


/* ---------------------------------------------------------------
   ADMIN

   Sign in on the home page as one of the family and the 🛠 button
   appears. Press P for the panel, or ; to type a command.

   These are cheats, plain and simple - the whole point of a clicker
   is the long climb - so they're for messing about rather than for
   playing properly. ";reset" puts everything back to zero.
   --------------------------------------------------------------- */

function bigNumber(word, fallback) {
  const n = parseFloat(word);
  if (!isFinite(n) || n < 0) return fallback;
  return Math.min(n, 1e12);              // stay inside what maths can count
}

const ADMIN_COMMANDS = [
  { name: "coins", alias: ["setcoins"], args: "<number>",
    help: "Set your coins to any number",
    run: words => { game.coins = bigNumber(words[0], game.coins);
                    refresh(); save();
                    return "Coins set to " + pretty(game.coins); } },

  { name: "add", args: "<number>",
    help: "Add coins to what you have",
    run: words => { game.coins += bigNumber(words[0], 100);
                    refresh(); save();
                    return "Now on " + pretty(game.coins) + " coins"; } },

  { name: "perclick", alias: ["click"], args: "<number>",
    help: "Coins for every tap",
    run: words => { game.clickLevel = Math.max(0, Math.round(bigNumber(words[0], 1)) - 1);
                    game.perClick = 1 + game.clickLevel;
                    refresh(); save();
                    return "Every tap gives " + pretty(game.perClick); } },

  { name: "persecond", alias: ["auto"], args: "<number>",
    help: "Coins every second on their own",
    run: words => { game.autoLevel = Math.max(0, Math.round(bigNumber(words[0], 1)));
                    game.perSecond = game.autoLevel;
                    refresh(); save();
                    return "Earning " + pretty(game.perSecond) + " a second"; } },

  { name: "rich", args: "",
    help: "A million coins, right now",
    run: () => { game.coins += 1000000; refresh(); save();
                 return "💰 A million more coins"; } },

  { name: "maxout", alias: ["max"], args: "",
    help: "Buy 25 of both upgrades at once",
    run: () => { game.clickLevel += 25; game.autoLevel += 25;
                 game.perClick = 1 + game.clickLevel;
                 game.perSecond = game.autoLevel;
                 refresh(); save();
                 return "Star Power " + game.clickLevel
                        + ", Shooting Stars " + game.autoLevel; } },

  { name: "reset", alias: ["zero"], args: "",
    help: "Back to nothing, like a new game",
    run: () => { game.coins = 0; game.perClick = 1; game.perSecond = 0;
                 game.clickLevel = 0; game.autoLevel = 0; game.totalClicks = 0;
                 refresh(); save();
                 return "All back to zero"; } }
];

if (typeof OlliePlayer !== "undefined" && OlliePlayer.isAdmin()
    && typeof OllieAdmin !== "undefined") {
  OllieAdmin.start({ commands: ADMIN_COMMANDS });
}
</script>

</body>
</html>
