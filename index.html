<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollie's Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #1a1040;
    background-image:
      radial-gradient(circle at 20% 20%, #3b1d7a 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, #0f4c81 0%, transparent 45%);
    color: #fff;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* --- little twinkly stars in the background --- */
  .star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 3s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 0.9; }
  }

  [hidden] { display: none !important; }

  /* --- who's playing? --- */
  #signin {
    position: relative;
    z-index: 2;
    max-width: 460px;
    margin: 40px auto;
    text-align: center;
    background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 26px 22px;
  }
  #signin h2 { font-size: 1.5rem; margin-bottom: 6px; }
  #signin p { color: #c9c2ff; font-size: 0.9rem; line-height: 1.5; }
  .signrow {
    display: flex; gap: 10px; justify-content: center;
    margin: 18px 0 6px;
    flex-wrap: wrap;
  }
  #playername {
    font-family: inherit; font-size: 1.1rem;
    padding: 11px 14px;
    width: 190px;
    text-align: center;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.35);
    color: #fff;
  }
  #btn-start {
    font-family: inherit; font-size: 1.05rem; font-weight: bold;
    padding: 11px 22px;
    border-radius: 12px; cursor: pointer;
    color: #1a1a2e; background: #ffd93d; border: none;
  }
  #signwarn { color: #ffd93d; font-size: 0.85rem; min-height: 1.2em; }

  #whobar {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-wrap: wrap;
    margin-bottom: 26px;
    font-size: 0.95rem;
  }
  #whoname { font-weight: bold; color: #ffd93d; }
  #whoadmin {
    font-size: 0.72rem; font-weight: bold; letter-spacing: 1px;
    color: #1a1a2e; background: #ffd93d;
    border-radius: 8px; padding: 3px 8px;
  }
  #btn-notme {
    font-family: inherit; font-size: 0.8rem;
    padding: 5px 11px;
    border-radius: 9px; cursor: pointer;
    color: #fff; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.28);
  }

  header {
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-size: clamp(2.5rem, 9vw, 4.5rem);
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd93d, #ff6b6b, #6bcBff, #a06bff, #ffd93d);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 8s linear infinite;
    text-shadow: 0 0 30px rgba(255, 217, 61, 0.25);
  }
  @keyframes rainbow {
    to { background-position: 300% 0; }
  }

  .tagline {
    margin-top: 10px;
    font-size: 1.1rem;
    color: #c9c2ff;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  #game-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 22px;
    list-style: none;
  }

  .game-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px;
    padding: 26px 20px;
    text-align: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .game-card:hover,
  .game-card:focus {
    transform: translateY(-6px) scale(1.03);
    background: rgba(255, 255, 255, 0.16);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    outline: none;
    border-color: #ffd93d;
  }

  .game-emoji {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 12px;
  }

  .game-name {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .game-blurb {
    font-size: 0.95rem;
    color: #cfc9f5;
    line-height: 1.4;
  }

  /* games that aren't built yet */
  .game-card.soon {
    opacity: 0.55;
    border-style: dashed;
    cursor: default;
  }
  .game-card.soon:hover {
    transform: none;
    box-shadow: none;
    border-color: rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.08);
  }

  .badge {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: #ffd93d;
    color: #1a1040;
    border-radius: 999px;
    padding: 3px 12px;
    font-weight: bold;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    color: #9d95cc;
    font-size: 0.9rem;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Ollie's Games</h1>
  <p class="tagline">Made by Ollie &mdash; pick a game and play!</p>
</header>

<div id="signin" hidden>
  <h2>Who's playing?</h2>
  <p>Type your name to get started. It's used in the games, so your
     friends know who they're playing against.</p>
  <div class="signrow">
    <input id="playername" maxlength="12" autocomplete="off" spellcheck="false"
           placeholder="Your name">
    <button id="btn-start" type="button">LET'S GO</button>
  </div>
  <p id="signwarn"></p>
</div>

<main id="games" hidden>
  <p id="whobar">
    Playing as <span id="whoname"></span>
    <span id="whoadmin" hidden>🛠 ADMIN</span>
    <button id="btn-notme" type="button">Not you?</button>
  </p>
  <ul id="game-list"></ul>
</main>

<footer>
  <p>Built with code, snacks and big ideas.</p>
</footer>

<script src="shared/player.js"></script>
<script>
  /* ==========================================================
     ADD A NEW GAME HERE!
     Copy one of the blocks below, change the words, and save.
     Set "ready" to true once the game actually works.
     ========================================================== */
  const games = [
    {
      name: "Ollie's Playground",
      emoji: "🤸",
      blurb: "A physics sandbox. Spawn people, fling them about, and let the crocodiles and crawlers loose!",
      link: "games/playground/index.html",
      ready: true
    },
    {
      name: "Star Arena",
      emoji: "🎯",
      blurb: "A 3D first-person battle! Make your own look, then fight the robots.",
      link: "games/arena/index.html",
      ready: true
    },
    {
      name: "Raise a Robot",
      emoji: "🤖",
      blurb: "Raise a little robot for twelve days \u2014 then he's the one standing between you and the invasion.",
      link: "games/robot/index.html",
      ready: true
    },
    {
      name: "Slime Ball",
      emoji: "🟢",
      blurb: "You're a wobbly blob of slime on a round floating island. Squelch about and gobble up all the goo!",
      link: "games/slime/index.html",
      ready: true
    },
    {
      name: "Melon Clicker",
      emoji: "🍉",
      blurb: "Tap Ollie's star to earn coins, then spend them on upgrades!",
      link: "games/melon-clicker/index.html",
      ready: true
    }
  ];

  // ---- This bit draws the cards. You don't need to change it. ----
  const list = document.getElementById("game-list");

  games.forEach(game => {
    const li = document.createElement("li");
    const card = document.createElement(game.ready ? "a" : "div");

    card.className = "game-card" + (game.ready ? "" : " soon");
    if (game.ready) card.href = game.link;

    card.innerHTML =
      '<span class="game-emoji">' + game.emoji + '</span>' +
      '<div class="game-name"></div>' +
      '<p class="game-blurb"></p>' +
      (game.ready ? '' : '<span class="badge">Coming soon</span>');

    card.querySelector(".game-name").textContent = game.name;
    card.querySelector(".game-blurb").textContent = game.blurb;

    li.appendChild(card);
    list.appendChild(li);
  });

  /* ==========================================================
     WHO'S PLAYING

     You put your name in once and every game remembers it. Five
     names in this house get admin powers in any game - that list
     lives in shared/player.js.
     ========================================================== */
  const signIn   = document.getElementById("signin");
  const gamesBox = document.getElementById("games");
  const nameBox  = document.getElementById("playername");
  const warnEl   = document.getElementById("signwarn");

  function showGames(name) {
    document.getElementById("whoname").textContent = name;
    document.getElementById("whoadmin").hidden = !OlliePlayer.isAdminName(name);
    signIn.hidden = true;
    gamesBox.hidden = false;
  }

  function askWho() {
    gamesBox.hidden = true;
    signIn.hidden = false;
    nameBox.value = OlliePlayer.name();
    warnEl.textContent = "";
    nameBox.focus();
  }

  function signInNow() {
    const name = OlliePlayer.setName(nameBox.value);
    if (!name) {
      warnEl.textContent = "Put a name in first!";
      nameBox.focus();
      return false;
    }
    showGames(name);
    return true;
  }

  document.getElementById("btn-start").addEventListener("click", signInNow);
  nameBox.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); signInNow(); }
  });
  document.getElementById("btn-notme").addEventListener("click", askWho);

  // already signed in? straight to the games
  if (OlliePlayer.name()) showGames(OlliePlayer.name());
  else askWho();

  // ---- Sprinkle some twinkly stars about ----
  for (let i = 0; i < 60; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(star);
  }
</script>

</body>
</html>
